<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DOMSUN TV</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
</head>

<body>

<h1>DOMSUN TV</h1>



<div class="box">

    <h2>Ajouter une vidéo / audio</h2>

    <input
        type="file"
        id="file"
        accept="video/mp4,video/*,audio/*"
    >

    <br>

    <input
        type="text"
        id="title"
        placeholder="titre"
    >

    <br>

    <button onclick="uploadFile()">
        ajouter
    </button>

    <p id="status"></p>

</div>



<div class="box">

    <h2>Ajouter une vidéo YouTube</h2>

    <input
        type="text"
        id="youtubeUrl"
        placeholder="URL YouTube"
        style="width:80%;"
    >

    <br>

    <input
        type="text"
        id="youtubeTitle"
        placeholder="titre"
    >

    <br>

    <button onclick="addYouTube()">
        ajouter YouTube
    </button>

    <p id="youtubeStatus"></p>

</div>




<div id="videos">
    <div class="box">
        chargement...
    </div>
</div>


<br>

<a class="nav" href="index.html">accueil</a>
<a class="nav" href="forum.html">forum</a>
<a class="nav" href="profil.html">profil</a>


<script>



const container =
    document.getElementById("videos");

const statusText =
    document.getElementById("status");




function escapeHtml(text) {

    return String(text || "")
        .replace(/[&<>"']/g, function(c) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[c];

        });
}




async function uploadFile() {

    const file =
        document.getElementById("file")
            .files[0];

    const title =
        document.getElementById("title")
            .value
            .trim();


    if (!file) {

        statusText.textContent =
            "choisis un fichier";

        return;
    }


    if (file.size > 100 * 1024 * 1024) {

        statusText.textContent =
            "fichier trop gros (maximum 100 MB)";

        return;
    }


    statusText.textContent =
        "upload en cours...";



    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();


    if (userError || !userData.user) {

        statusText.textContent =
            "tu dois être connecté";

        return;
    }


    const user =
        userData.user;


    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", user.id)
            .single();


    if (profileError || !profile) {

        statusText.textContent =
            "profil introuvable";

        return;
    }



    const safeName =
        file.name
            .replace(/[^a-zA-Z0-9._-]/g, "_");


    /* emplacement dans Storage */

    const filePath =
        "uploads/" +
        user.id +
        "/" +
        Date.now() +
        "_" +
        safeName;



    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("media")
            .upload(
                filePath,
                file,
                {
                    contentType:
                        file.type,

                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    if (uploadError) {

        statusText.textContent =
            "erreur upload: " +
            uploadError.message;

        return;
    }


    const { data: publicData } =
        supabaseClient
            .storage
            .from("media")
            .getPublicUrl(filePath);


    const publicUrl =
        publicData.publicUrl;



    let type = "audio";


    if (file.type.startsWith("video")) {

        type = "video";
    }



    const { error: dbError } =
        await supabaseClient
            .from("media_items")
            .insert({

                username:
                    profile.username,

                type:
                    type,

                title:
                    title || file.name,

                url:
                    publicUrl

            });


    if (dbError) {

        statusText.textContent =
            "fichier uploadé mais erreur DB: " +
            dbError.message;

        return;
    }


    /* nettoyer */

    document.getElementById("file").value = "";
    document.getElementById("title").value = "";


    statusText.textContent =
        "fichier sauvegardé !";


    loadMedia();
}




async function addYouTube() {

    const url =
        document.getElementById("youtubeUrl")
            .value
            .trim();


    const title =
        document.getElementById("youtubeTitle")
            .value
            .trim();


    const status =
        document.getElementById("youtubeStatus");


    if (!url) {

        status.textContent =
            "mets une URL YouTube";

        return;
    }


    /* vérifier connexion */

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();


    if (userError || !userData.user) {

        status.textContent =
            "tu dois être connecté";

        return;
    }


  
    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", userData.user.id)
            .single();


    if (profileError || !profile) {

        status.textContent =
            "profil introuvable";

        return;
    }


    /* vérifier que c'est bien YouTube */

    let parsedUrl;

    try {

        parsedUrl =
            new URL(url);

    } catch (e) {

        status.textContent =
            "URL invalide";

        return;
    }


    const hostname =
        parsedUrl.hostname
            .toLowerCase()
            .replace("www.", "");


    if (
        hostname !== "youtube.com" &&
        hostname !== "youtu.be" &&
        hostname !== "m.youtube.com"
    ) {

        status.textContent =
            "mets une URL YouTube valide";

        return;
    }


 

    const { error } =
        await supabaseClient
            .from("media_items")
            .insert({

                username:
                    profile.username,

                type:
                    "youtube",

                title:
                    title || "YouTube",

                url:
                    url

            });


    if (error) {

        status.textContent =
            "erreur: " +
            error.message;

        return;
    }




    document.getElementById("youtubeUrl").value = "";
    document.getElementById("youtubeTitle").value = "";


    status.textContent =
        "vidéo YouTube ajoutée !";


    loadMedia();
}



function getYouTubeEmbed(url) {

    try {

        const parsed =
            new URL(url);


        let videoId = "";


        if (
            parsed.hostname === "youtu.be" ||
            parsed.hostname === "www.youtu.be"
        ) {

            videoId =
                parsed.pathname
                    .replace("/", "");

        } else {

            videoId =
                parsed.searchParams
                    .get("v");
        }


        if (!videoId) {
            return null;
        }


        return "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId);

    } catch (e) {

        return null;
    }
}



async function loadMedia() {

    container.innerHTML =
        '<div class="box">chargement...</div>';


    const { data, error } =
        await supabaseClient
            .from("media_items")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        container.innerHTML =
            '<div class="box">erreur: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="box">aucun média</div>';

        return;
    }


    container.innerHTML =
        data.map(function(item) {


       
            if (item.type === "video") {

                return `
                    <div class="box">

                        <h2>
                            ${escapeHtml(item.title)}
                        </h2>

                        <p>
                            par
                            ${escapeHtml(item.username)}
                        </p>

                        <video
                            controls
                            preload="metadata"
                            style="
                                max-width:90%;
                                max-height:500px;
                            "
                            src="${escapeHtml(item.url)}"
                        ></video>

                    </div>
                `;
            }


       

            if (item.type === "audio") {

                return `
                    <div class="box">

                        <h2>
                            ${escapeHtml(item.title)}
                        </h2>

                        <p>
                            par
                            ${escapeHtml(item.username)}
                        </p>

                        <audio
                            controls
                            src="${escapeHtml(item.url)}"
                        ></audio>

                    </div>
                `;
            }



            if (item.type === "youtube") {

                const embedUrl =
                    getYouTubeEmbed(item.url);


                if (!embedUrl) {

                    return `
                        <div class="box">

                            <h2>
                                ${escapeHtml(item.title)}
                            </h2>

                            <p>
                                par
                                ${escapeHtml(item.username)}
                            </p>

                            <p>
                                <a
                                    href="${escapeHtml(item.url)}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    regarder sur YouTube
                                </a>
                            </p>

                        </div>
                    `;
                }


                return `
                    <div class="box">

                        <h2>
                            ${escapeHtml(item.title)}
                        </h2>

                        <p>
                            par
                            ${escapeHtml(item.username)}
                        </p>

                        <iframe
                            width="560"
                            height="315"
                            src="${embedUrl}"
                            title="${escapeHtml(item.title)}"
                            frameborder="0"
                            allowfullscreen
                            style="
                                max-width:100%;
                            "
                        ></iframe>

                        <p>
                            <a
                                href="${escapeHtml(item.url)}"
                                target="_blank"
                                rel="noopener"
                            >
                                ouvrir sur YouTube
                            </a>
                        </p>

                    </div>
                `;
            }


            return "";

        }).join("");
}




loadMedia();

</script>

</body>
</html>
