<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DOMSUN TV</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
</head>

<body>

<h1>DOMSUN TV</h1>


<div class="box">

    <h2>Ajouter une vidéo / audio</h2>

    <input
        type="file"
        id="file"
        accept="video/mp4,video/*,audio/*"
    >

    <br>

    <input
        type="text"
        id="title"
        placeholder="titre"
    >

    <br>

    <button onclick="uploadFile()">
        ajouter
    </button>

    <p id="status"></p>

</div>


<div id="videos">
    <div class="box">chargement...</div>
</div>


<br>

<a class="nav" href="index.html">accueil</a>
<a class="nav" href="forum.html">forum</a>
<a class="nav" href="profil.html">profil</a>


<script>


const container =
    document.getElementById("videos");

const statusText =
    document.getElementById("status");


function escapeHtml(text) {

    return String(text || "")
        .replace(/[&<>"']/g, function(c) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[c];

        });
}


async function uploadFile() {

    const file =
        document.getElementById("file")
            .files[0];


    const title =
        document.getElementById("title")
            .value
            .trim();


    if (!file) {

        statusText.textContent =
            "choisis un fichier";

        return;
    }


    /* limite 100 MB */

    if (file.size > 100 * 1024 * 1024) {

        statusText.textContent =
            "fichier trop gros (maximum 100 MB)";

        return;
    }


    statusText.textContent =
        "upload en cours...";


    /* vérifier connexion */

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();


    if (userError || !userData.user) {

        statusText.textContent =
            "tu dois être connecté";

        return;
    }


    const user =
        userData.user;


  

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", user.id)
            .single();


    if (profileError || !profile) {

        statusText.textContent =
            "profil introuvable";

        return;
    }


   

    const safeName =
        file.name
            .replace(/[^a-zA-Z0-9._-]/g, "_");


   

    const filePath =
        "uploads/" +
        user.id +
        "/" +
        Date.now() +
        "_" +
        safeName;


    

    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("media")
            .upload(
                filePath,
                file,
                {
                    contentType:
                        file.type,

                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    if (uploadError) {

        statusText.textContent =
            "erreur upload: " +
            uploadError.message;

        return;
    }


    /* URL publique */

    const { data: publicData } =
        supabaseClient
            .storage
            .from("media")
            .getPublicUrl(filePath);


    const publicUrl =
        publicData.publicUrl;


    /* type */

    let type =
        "audio";


    if (file.type.startsWith("video")) {
        type = "video";
    }


    /* enregistrer dans la DB */

    const { error: dbError } =
        await supabaseClient
            .from("media_items")
            .insert({

                username:
                    profile.username,

                type:
                    type,

                title:
                    title || file.name,

                url:
                    publicUrl

            });


    if (dbError) {

        statusText.textContent =
            "fichier uploadé mais erreur DB: " +
            dbError.message;

        return;
    }


    /* nettoyer */

    document.getElementById("file").value = "";
    document.getElementById("title").value = "";


    statusText.textContent =
        "fichier sauvegardé !";


    loadMedia();
}


async function loadMedia() {

    container.innerHTML =
        '<div class="box">chargement...</div>';


    const { data, error } =
        await supabaseClient
            .from("media_items")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        container.innerHTML =
            '<div class="box">erreur: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="box">aucun média</div>';

        return;
    }


    container.innerHTML =
        data.map(function(item) {


            const title =
                escapeHtml(item.title);


            const username =
                escapeHtml(item.username);


            const url =
                escapeHtml(item.url);


            if (item.type === "video") {

                return `
                    <div class="box">

                        <h2>${title}</h2>

                        <p>
                            par ${username}
                        </p>

                        <video
                            controls
                            preload="metadata"
                            style="
                                max-width:90%;
                                max-height:500px;
                            "
                            src="${url}"
                        ></video>

                    </div>
                `;
            }


            if (item.type === "audio") {

                return `
                    <div class="box">

                        <h2>${title}</h2>

                        <p>
                            par ${username}
                        </p>

                        <audio
                            controls
                            src="${url}"
                        ></audio>

                    </div>
                `;
            }


            return "";

        }).join("");
}


loadMedia();

</script>

</body>
</html>
