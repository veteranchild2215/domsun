```html
<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>domsun tube</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>DOMSUN TV</h1>

<div class="box">

<h2>youtube</h2>

<input
  id="ytlink"
  placeholder="colle lien youtube"
>

<button onclick="addYT()">
  ajouter
</button>

<h2>video / audio</h2>

<input
  type="file"
  id="file"
  accept="video/*,audio/*"
>

<button onclick="addFile()">
  ajouter
</button>

<p id="status"></p>

</div>

<div id="videos"></div>

<a class="nav" href="index.html">
  ⬅ accueil
</a>

<script>



const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);




const container =
document.getElementById("videos");

const status =
document.getElementById("status");




function esc(s) {

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );

}




function getYoutubeID(link) {

  try {

    const u = new URL(link);

    if (
      u.hostname === "youtu.be" ||
      u.hostname === "www.youtu.be"
    ) {

      return u.pathname
        .replace("/", "")
        .split("?")[0];

    }

    if (
      u.hostname.includes("youtube.com")
    ) {

      return u.searchParams.get("v") || "";

    }

  } catch (e) {}

  return "";

}




async function addYT() {

  const input =
    document.getElementById("ytlink");

  const link =
    input.value.trim();

  const id =
    getYoutubeID(link);

  if (!id) {

    alert(
      "Lien YouTube pas compris."
    );

    return;

  }

  status.textContent =
    "ajout...";

  const username =
    localStorage.getItem("pseudo") ||
    "anonymous";


  const { error } =
    await supabaseClient
      .from("media_items")
      .insert({

        username: username,

        type: "youtube",

        title: "YouTube",

        url: id

      });


  if (error) {

    console.error(error);

    status.textContent = "";

    alert(
      "Impossible d'ajouter la vidéo :\n\n" +
      error.message
    );

    return;

  }


  input.value = "";

  status.textContent =
    "video ajoutee !";

  await loadMedia();


  setTimeout(() => {

    status.textContent = "";

  }, 1500);

}




function addFile() {

  const f =
    document.getElementById("file").files[0];

  if (!f) {

    alert(
      "Choisis une video ou un audio."
    );

    return;

  }


  const url =
    URL.createObjectURL(f);


  const box =
    document.createElement("div");

  box.className = "box";


  const title =
    document.createElement("p");

  title.innerHTML =
    "<b>" + esc(f.name) + "</b>";

  box.appendChild(title);


  if (f.type.startsWith("video")) {

    const video =
      document.createElement("video");

    video.controls = true;

    video.src = url;

    video.style.maxWidth = "100%";

    box.appendChild(video);

  }


  else if (f.type.startsWith("audio")) {

    const audio =
      document.createElement("audio");

    audio.controls = true;

    audio.src = url;

    box.appendChild(audio);

  }


  else {

    URL.revokeObjectURL(url);

    alert(
      "Format non supporté."
    );

    return;

  }


  container.prepend(box);

}




async function reportMedia(mediaId) {

  const username =
    localStorage.getItem("pseudo");

  if (!username) {

    alert(
      "Connecte-toi pour signaler une video."
    );

    return;

  }


  const reason =
    prompt(
      "Pourquoi veux-tu signaler cette video ?"
    );


  if (!reason || !reason.trim()) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("media_reports")
      .insert({

        media_id: mediaId,

        reporter_username: username,

        reason: reason.trim()

      });


  if (error) {

    console.error(error);

    alert(
      "Impossible d'envoyer le signalement:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Signalement envoyé. Merci."
  );

}




async function loadMedia() {

  const { data, error } =
    await supabaseClient
      .from("media_items")
      .select("*")
      .order(
        "created_at",
        { ascending: true }
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      "<div class='box'>" +
      "<b>Erreur Supabase</b><br>" +
      esc(error.message) +
      "</div>";

    return;

  }


  if (!data || data.length === 0) {

    return;

  }


  data.forEach(item => {

    if (item.type !== "youtube") {

      return;

    }


    const box =
      document.createElement("div");

    box.className = "box";


    box.innerHTML = `
      <p>
        ajoute par:
        <b>${esc(item.username)}</b>
      </p>

      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/${encodeURIComponent(item.url)}"
        frameborder="0"
        allowfullscreen>
      </iframe>

      <br><br>

      <button
        onclick="reportMedia(${item.id})">
        Signaler cette video
      </button>
    `;


    container.appendChild(box);

  });

}


loadMedia();

</script>

</body>
</html>
