<!doctype html>

<html lang="fr">

<head>

<meta charset="utf-8">

<title>DOMSUN Themes</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<h1>DOMSUN THEMES</h1>


<div class="box">

<h2>choisi ton theme</h2>

<p>
Clique sur un bouton pour changer le theme.
</p>


<button onclick="changeTheme('xp_bleu.css')">
Bleu
</button>


<button onclick="changeTheme('xp_vert.css')">
Vert
</button>


<button onclick="changeTheme('xp_rose.css')">
Rose
</button>


<button onclick="changeTheme('xp_gris.css')">
Gris
</button>


<button onclick="changeTheme('xp_noir.css')">
Dark
</button>


<button onclick="changeTheme('mono.css')">
Mono
</button>

</div>


<div class="box">

<h2>Theme actuel</h2>

<p id="currentTheme">
aucun
</p>

</div>


<a class="nav" href="index.html">
retour accueil
</a>


<script src="theme.js"></script>


<script>

function changeTheme(theme) {

  setTheme(theme);

  document.getElementById("currentTheme")
    .textContent = theme;

}


const saved =
  localStorage.getItem("domsunTheme");

if (saved) {

  document.getElementById("currentTheme")
    .textContent = saved;

}

</script>


</body>

</html>
