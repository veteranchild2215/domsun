<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>profil</title>
<link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>mon profil</h1>
<div class="box">
<p id="status">chargement...</p>
<p>photo profil:</p><input type="file" id="img" accept="image/*"><br>
<p>pseudo:</p><input id="pseudo" placeholder="ton pseudo"><br>
<p>bio:</p><textarea id="bio" placeholder="je sui domsun tro for"></textarea><br>
<button onclick="save()">sauver profil</button>
<h2>preview</h2>
<img id="preview" class="avatar" style="width:100px;height:100px;object-fit:cover">
<p id="showpseudo"></p><p id="showbio"></p>
</div>
<a class="nav" href="index.html">accueil</a>
<a class="nav" href="forum.html">forum</a>
<a class="nav" href="dm.html">messages</a>

<script>
const SUPABASE_URL="https://cwmlajtwhriqjoopknsp.supabase.co";
const SUPABASE_KEY="sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;

async function load(){
 const {data:authData}=await supabaseClient.auth.getUser();
 currentUser=authData?.user||null;
 if(!currentUser){location.href="login.html";return;}

 const {data:profile,error}=await supabaseClient.from("profiles")
  .select("id,username,avatar,bio,is_admin,is_moderator")
  .eq("id",currentUser.id).maybeSingle();

 if(error||!profile){status.textContent="profil introuvable.";return;}
 currentProfile=profile;
 pseudo.value=profile.username||"";
 bio.value=profile.bio||"";
 showpseudo.textContent="pseudo: "+profile.username;
 showbio.textContent="bio: "+(profile.bio||"");
 if(profile.avatar)preview.src=profile.avatar;
 status.textContent=profile.is_admin?"role: ADMIN":profile.is_moderator?"role: MODERATEUR":"role: membre";
}

async function save(){
 const p=pseudo.value.trim(),b=bio.value.trim(),file=img.files[0];
 if(!p){status.textContent="pseudo obligatoire.";return;}

 let avatar=currentProfile?.avatar||null;
 if(file){
   if(file.size>300000){status.textContent="image trop grande: moins de 300 Ko.";return;}
   avatar=await new Promise((resolve,reject)=>{
     const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
   });
 }

 const {error}=await supabaseClient.from("profiles").update({
   username:p,bio:b,avatar:avatar
 }).eq("id",currentUser.id);

 if(error){status.textContent=error.message;return;}
 currentProfile.username=p;currentProfile.bio=b;currentProfile.avatar=avatar;
 localStorage.setItem("pseudo",p);
 if(avatar)preview.src=avatar;
 showpseudo.textContent="pseudo: "+p;
 showbio.textContent="bio: "+b;
 status.textContent="profil sauve !";
}
load();
</script>
</body>
</html>
