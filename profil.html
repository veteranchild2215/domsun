<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>profil</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

</head>

<body>

<h1>mon profil</h1>


<div class="box">

<p>photo profil:</p>

<input
    type="file"
    id="img"
    accept="image/*"
>

<br>


<p>pseudo:</p>

<input
    id="pseudo"
    placeholder="ton pseudo"
>


<br>


<p>bio:</p>

<textarea
    id="bio"
    placeholder="je sui domsun tro for"
></textarea>

<br>


<button onclick="save()">
    sauver profil
</button>


<h2>preview</h2>

<img
    id="preview"
    class="avatar"
>

<p id="showpseudo"></p>

<p id="showbio"></p>

</div>




<div class="box">

<h2>amis</h2>


<input
    id="friendname"
    placeholder="pseudo ami"
>


<button onclick="addFriend()">
    ajouter
</button>


<div id="friends"></div>

</div>



<a class="nav" href="index.html">
    accueil
</a>

<a class="nav" href="forum.html">
    forum
</a>

<a class="nav" href="dm.html">
    messages
</a>



<script>




function show() {

    const p =
        localStorage.getItem("pseudo")
        || "anonymous";

    const b =
        localStorage.getItem("bio")
        || "";

    const a =
        localStorage.getItem("avatar");


    document.getElementById("pseudo").value = p;

    document.getElementById("bio").value = b;

    document.getElementById("showpseudo").textContent =
        "pseudo: " + p;

    document.getElementById("showbio").textContent =
        "bio: " + b;


    if (a) {

        document.getElementById("preview").src = a;

    }

}




function save() {

    const p =
        document.getElementById("pseudo")
            .value
            .trim()
        || "anonymous";


    const b =
        document.getElementById("bio")
            .value;


    localStorage.setItem(
        "pseudo",
        p
    );


    localStorage.setItem(
        "bio",
        b
    );


    const file =
        document.getElementById("img")
            .files[0];


    if (file) {

        const reader =
            new FileReader();


        reader.onload = function() {

            localStorage.setItem(
                "avatar",
                reader.result
            );


            show();

        };


        reader.readAsDataURL(file);

    } else {

        show();

    }


    alert("profil sauve");

}





function addFriend() {

    const f =
        document.getElementById("friendname")
            .value
            .trim();


    if (!f) {
        return;
    }


    const list =
        JSON.parse(
            localStorage.getItem("friends")
            || "[]"
        );


    if (!list.includes(f)) {

        list.push(f);

    }


    localStorage.setItem(
        "friends",
        JSON.stringify(list)
    );


    document.getElementById(
        "friendname"
    ).value = "";


    showFriends();

}



function showFriends() {

    const list =
        JSON.parse(
            localStorage.getItem("friends")
            || "[]"
        );


    const friends =
        document.getElementById("friends");


    if (list.length === 0) {

        friends.innerHTML =
            "<p>pas dami encore</p>";

        return;
    }


    friends.innerHTML =
        list.map(function(x) {

            return `
                <p>

                    💙 ${escapeHtml(x)}

                    <button
                        onclick="location.href='dm.html?to=${encodeURIComponent(x)}'"
                    >
                        message
                    </button>

                </p>
            `;

        }).join("");

}





function escapeHtml(s) {

    return String(s)
        .replace(
            /[&<>"']/g,
            function(c) {

                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[c];

            }
        );

}



show();

showFriends();

</script>

</body>

</html>
