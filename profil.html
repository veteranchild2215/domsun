<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>DOMSUN Profil</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

<style>

.profile-page {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

.profile-card {
  width: min(600px, 90%);
  text-align: center;
}

.profile-avatar {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 0;
  display: block;
  margin: 15px auto;
}

.profile-bio {
  white-space: pre-wrap;
  word-break: break-word;
}

.profile-actions {
  margin-top: 20px;
}

.profile-actions button {
  margin: 5px;
}

</style>

</head>


<body>

<h1>DOMSUN Profil</h1>


<div class="profile-page">

  <div class="profile-card">


    <div class="box">

      <div id="profileContent">
        chargement...
      </div>

    </div>


    <br>


    <div
      class="box"
      id="editBox"
      style="display:none;"
    >

      <h2>Modifier mon profil</h2>


      <label>
        pseudo
      </label>

      <br>

      <input
        id="editUsername"
        type="text"
        maxlength="30"
      >


      <br><br>


      <label>
        bio
      </label>

      <br>

      <textarea
        id="editBio"
        maxlength="500"
        style="width:90%;height:100px;"
      ></textarea>


      <br><br>


      <label>
        avatar
      </label>

      <br>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
      >


      <br><br>


      <button onclick="saveProfile()">
        enregistrer
      </button>


      <p id="saveStatus"></p>

    </div>


    <br>


    <div class="profile-actions">

      <a
        class="nav"
        href="index.html"
      >
        accueil
      </a>


      <a
        class="nav"
        href="forum.html"
      >
        forum
      </a>


      <a
        class="nav"
        href="dm.html"
      >
        messages
      </a>

    </div>

  </div>

</div>


<script>


const profileContent =
  document.getElementById("profileContent");

const editBox =
  document.getElementById("editBox");

const editUsername =
  document.getElementById("editUsername");

const editBio =
  document.getElementById("editBio");

const avatarFile =
  document.getElementById("avatarFile");

const saveStatus =
  document.getElementById("saveStatus");


let currentUser = null;

let currentProfile = null;

let viewedProfile = null;



function escapeHtml(text) {

  return String(text || "").replace(
    /[&<>"']/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c];

    }
  );

}



function getRequestedUsername() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("user");

}


async function loadCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(error);

  }


  currentUser =
    data && data.user
      ? data.user
      : null;

}



async function loadMyProfile() {

  if (!currentUser) {

    return null;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.error(error);

    return null;

  }


  return data;

}



async function loadProfileByUsername(username) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("username", username)
      .maybeSingle();


  if (error) {

    console.error(error);

    return null;

  }


  return data;

}
function renderProfile(profile, isOwnProfile) {

  if (!profile) {

    profileContent.innerHTML =
      "<h2>Profil introuvable</h2>" +

      "<p>Ce profil n'existe pas.</p>";

    editBox.style.display =
      "none";

    return;

  }


  const username =
    escapeHtml(
      profile.username || "user"
    );


  const bio =
    escapeHtml(
      profile.bio || "Pas encore de bio."
    );


  let avatarHTML = "";


  if (profile.avatar) {

    avatarHTML =

      "<img " +

      "class='profile-avatar' " +

      "src=\"" +
      escapeHtml(profile.avatar) +
      "\" " +

      "alt=\"avatar\">";

  }

  else {

    avatarHTML =

      "<div " +

      "class='profile-avatar' " +

      "style=\"" +
      "border:1px solid #888;" +
      "display:flex;" +
      "align-items:center;" +
      "justify-content:center;" +
      "\">" +

      "pas d'avatar" +

      "</div>";

  }


  let buttonsHTML = "";



  if (!isOwnProfile) {

    buttonsHTML =

      "<br>" +

      "<button " +

      "onclick=\"openMessage('" +

      escapeHtml(
        profile.username
      ) +

      "')\">" +

      "envoyer un message" +

      "</button>";

  }


  profileContent.innerHTML =

    avatarHTML +

    "<h2>" +
      username +
    "</h2>" +

    "<div class='profile-bio'>" +

      "<p>" +
        bio +
      "</p>" +

    "</div>" +

    buttonsHTML;


  

  if (isOwnProfile) {

    editBox.style.display =
      "block";

    editUsername.value =
      profile.username || "";

    editBio.value =
      profile.bio || "";

  }

  else {

    editBox.style.display =
      "none";

  }

}




function openMessage(username) {

  window.location.href =
    "dm.html?to=" +
    encodeURIComponent(username);

}


async function saveProfile() {

  if (!currentUser) {

    saveStatus.textContent =
      "tu dois être connecté";

    return;

  }


  const username =
    editUsername.value.trim();


  const bio =
    editBio.value.trim();


  if (!username) {

    saveStatus.textContent =
      "le pseudo est obligatoire";

    return;

  }


  saveStatus.textContent =
    "enregistrement...";


  let avatarUrl =
    currentProfile
      ? currentProfile.avatar
      : null;




  const file =
    avatarFile.files[0];


  if (file) {

    if (!file.type.startsWith("image/")) {

      saveStatus.textContent =
        "le fichier doit être une image";

      return;

    }


    if (file.size > 5 * 1024 * 1024) {

      saveStatus.textContent =
        "image trop grosse (maximum 5 MB)";

      return;

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =

      "avatars/" +

      currentUser.id +

      "/" +

      Date.now() +

      "_" +

      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          file,
          {
            contentType: file.type,
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(uploadError);

      saveStatus.textContent =
        "erreur avatar: " +
        uploadError.message;

      return;

    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(filePath);


    avatarUrl =
      publicData.publicUrl;

  }




  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({

        username: username,

        bio: bio,

        avatar: avatarUrl

      })
      .eq(
        "id",
        currentUser.id
      )
      .select()
      .maybeSingle();


  if (error) {

    console.error(error);

    saveStatus.textContent =
      "erreur: " +
      error.message;

    return;

  }


  currentProfile =
    data;


  viewedProfile =
    data;


  await supabaseClient
    .from("forum_posts")
    .update({

      username: username,

      avatar: avatarUrl

    })
    .eq(
      "user_id",
      currentUser.id
    );


  saveStatus.textContent =
    "profil enregistré !";


  avatarFile.value = "";


  renderProfile(
    viewedProfile,
    true
  );


  setTimeout(function() {

    saveStatus.textContent = "";

  }, 2000);

}


async function startProfile() {

  await loadCurrentUser();


  const requestedUsername =
    getRequestedUsername();




  if (!requestedUsername) {

    if (!currentUser) {

      profileContent.innerHTML =
        "<h2>Tu n'es pas connecté</h2>" +

        "<p>Connecte-toi pour voir ton profil.</p>";

      return;

    }


    currentProfile =
      await loadMyProfile();


    viewedProfile =
      currentProfile;


    renderProfile(
      viewedProfile,
      true
    );

    return;

  }




  viewedProfile =
    await loadProfileByUsername(
      requestedUsername
    );


  if (!viewedProfile) {

    profileContent.innerHTML =
      "<h2>Profil introuvable</h2>" +

      "<p>Utilisateur : " +

      escapeHtml(
        requestedUsername
      ) +

      "</p>";

    return;

  }


  const isOwnProfile =
    currentUser &&
    viewedProfile.id === currentUser.id;


  if (isOwnProfile) {

    currentProfile =
      viewedProfile;

  }


  renderProfile(
    viewedProfile,
    isOwnProfile
  );

}


startProfile();

</script>

</body>

</html>
