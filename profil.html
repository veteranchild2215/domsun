<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<title>profil - domsun</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

<style>

.profile-page {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

.profile-card {
  width: min(600px, 90%);
  text-align: center;
}

.profile-avatar {
  width: 140px;
  height: 140px;
  object-fit: cover;
  border-radius: 0;
  border: 2px solid #555;
  display: block;
  margin: 15px auto;
}

.profile-name {
  font-size: 24px;
  margin: 10px 0;
}

.profile-bio {
  margin: 15px auto;
  padding: 12px;
  max-width: 500px;
}

.profile-date {
  margin: 15px 0;
  font-size: 14px;
}

.profile-button {
  margin: 8px;
  padding: 8px 18px;
  cursor: pointer;
}

.edit-box {
  margin-top: 25px;
  padding: 15px;
}

.edit-box input,
.edit-box textarea {
  width: 90%;
  max-width: 500px;
  margin: 6px;
  padding: 8px;
  box-sizing: border-box;
}

.edit-box textarea {
  min-height: 100px;
  resize: vertical;
}

.hidden {
  display: none;
}

.error {
  color: red;
  margin: 20px;
}

#messageArea {
  margin: 15px 0;
}

</style>

</head>


<body>


<h1>profil</h1>


<div class="profile-page">

  <div class="profile-card box">

    <div id="loading">
      chargement...
    </div>


    <div id="profileContent" class="hidden">


      <img
        id="avatar"
        class="profile-avatar"
        src=""
        alt="avatar"
      >



      <div
        id="username"
        class="profile-name">
      </div>



      <div
        id="bio"
        class="profile-bio">
      </div>



      <div
        id="createdAt"
        class="profile-date">
      </div>



      <div id="messageArea" class="hidden">

        <button
          id="messageButton"
          class="profile-button"
          type="button">
          envoyer un message
        </button>

      </div>



      <div
        id="editArea"
        class="edit-box hidden">

        <h3>modifier mon profil</h3>


        <input
          id="editUsername"
          type="text"
          placeholder="nom d'utilisateur"
        >


        <br>


        <textarea
          id="editBio"
          placeholder="ta bio"></textarea>


        <br>


        <input
          id="avatarFile"
          type="file"
          accept="image/*"
        >


        <br>


        <button
          class="profile-button"
          id="saveButton"
          type="button">
          enregistrer
        </button>


        <p id="editStatus"></p>

      </div>

    </div>


    <div
      id="error"
      class="error hidden">
    </div>

  </div>

</div>


<a
  class="nav"
  href="index.html">
  accueil
</a>


<a
  class="nav"
  href="forum.html">
  forum
</a>


<script>




let currentUser = null;
let viewedProfile = null;




function esc(text) {

  return String(text ?? "").replace(
    /[&<>"']/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[c];

    }
  );

}




async function getCurrentUser() {

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "Auth error:",
      error
    );

    return null;

  }


  return data.user || null;

}




async function loadProfile() {

  loading.classList.remove("hidden");

  profileContent.classList.add("hidden");

  error.classList.add("hidden");


  

  currentUser =
    await getCurrentUser();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const requestedUsername =
    params.get("user");


  

  if (requestedUsername) {

    const {
      data,
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .select(
        "id, username, avatar, bio, created_at"
      )
      .eq(
        "username",
        requestedUsername
      )
      .maybeSingle();


    if (profileError) {

      console.error(
        "Profile error:",
        profileError
      );

      showError(
        "erreur chargement profil : " +
        profileError.message
      );

      return;

    }


    if (!data) {

      showError(
        "profil introuvable"
      );

      return;

    }


    viewedProfile = data;

  }


  else {

    if (!currentUser) {

      showError(
        "tu dois être connecté pour voir ton profil"
      );

      return;

    }


    const {
      data,
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .select(
        "id, username, avatar, bio, created_at"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


    if (profileError) {

      console.error(
        "Profile error:",
        profileError
      );

      showError(
        "erreur chargement profil : " +
        profileError.message
      );

      return;

    }


    if (!data) {

      showError(
        "ton profil n'existe pas encore"
      );

      return;

    }


    viewedProfile = data;

  }


  displayProfile();

}




function displayProfile() {

  loading.classList.add("hidden");

  profileContent.classList.remove("hidden");


  username.textContent =
    viewedProfile.username;



  if (
    viewedProfile.bio &&
    viewedProfile.bio.trim()
  ) {

    bio.textContent =
      viewedProfile.bio;

  }

  else {

    bio.textContent =
      "pas de bio";

  }


 

  if (viewedProfile.avatar) {

    avatar.src =
      viewedProfile.avatar;

  }

  else {

    avatar.src =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' " +
        "width='140' height='140'>" +
        "<rect width='140' height='140' fill='#ddd'/>" +
        "<text x='70' y='78' " +
        "text-anchor='middle' " +
        "font-size='18'>avatar</text>" +
        "</svg>"
      );

  }



  if (viewedProfile.created_at) {

    const date =
      new Date(
        viewedProfile.created_at
      );


    if (!isNaN(date.getTime())) {

      createdAt.textContent =
        "compte créé le " +
        date.toLocaleDateString(
          "fr-FR",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

    }

    else {

      createdAt.textContent =
        "date de création inconnue";

    }

  }

  else {

    createdAt.textContent =
      "date de création inconnue";

  }


  const isOwnProfile =
    currentUser &&
    viewedProfile.id === currentUser.id;


  

  if (isOwnProfile) {

    messageArea.classList.add(
      "hidden"
    );

    editArea.classList.remove(
      "hidden"
    );


    editUsername.value =
      viewedProfile.username || "";


    editBio.value =
      viewedProfile.bio || "";

  }


  

  else {

    editArea.classList.add(
      "hidden"
    );


    messageArea.classList.remove(
      "hidden"
    );



    messageButton.onclick =
      function() {

        const target =
          encodeURIComponent(
            viewedProfile.username
          );


        window.location.href =
          "dm.html?to=" +
          target;

      };

  }

}




async function saveProfile() {

  if (!currentUser) {

    editStatus.textContent =
      "tu dois être connecté";

    return;

  }


  const newUsername =
    editUsername.value.trim();


  const newBio =
    editBio.value.trim();


  if (!newUsername) {

    editStatus.textContent =
      "le nom d'utilisateur est obligatoire";

    return;

  }


  editStatus.textContent =
    "enregistrement...";


  let avatarUrl =
    viewedProfile.avatar || null;


  const file =
    avatarFile.files[0];


  if (file) {

    if (
      file.size >
      5 * 1024 * 1024
    ) {

      editStatus.textContent =
        "image trop grande (5 MB maximum)";

      return;

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =
      "avatars/" +
      currentUser.id +
      "/" +
      Date.now() +
      "_" +
      safeName;


    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from("media")
      .upload(
        filePath,
        file
      );


    if (uploadError) {

      console.error(
        uploadError
      );

      editStatus.textContent =
        "erreur upload avatar : " +
        uploadError.message;

      return;

    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(
          filePath
        );


    avatarUrl =
      publicData.publicUrl;

  }



  const {
    error: updateError
  } = await supabaseClient
    .from("profiles")
    .update({

      username: newUsername,
      bio: newBio,
      avatar: avatarUrl

    })
    .eq(
      "id",
      currentUser.id
    );


  if (updateError) {

    console.error(
      updateError
    );

    editStatus.textContent =
      "erreur : " +
      updateError.message;

    return;

  }


 

  const {
    error: forumError
  } = await supabaseClient
    .from("forum_posts")
    .update({

      username: newUsername,
      avatar: avatarUrl

    })
    .eq(
      "user_id",
      currentUser.id
    );


  if (forumError) {

    console.warn(
      "Forum update error:",
      forumError
    );

  }




  viewedProfile.username =
    newUsername;

  viewedProfile.bio =
    newBio;

  viewedProfile.avatar =
    avatarUrl;


  displayProfile();


  editStatus.textContent =
    "profil enregistré !";


  setTimeout(
    function() {

      editStatus.textContent = "";

    },
    1500
  );

}




function showError(message) {

  loading.classList.add(
    "hidden"
  );

  profileContent.classList.add(
    "hidden"
  );

  error.classList.remove(
    "hidden"
  );

  error.textContent =
    message;

}




saveButton.onclick =
  saveProfile;




loadProfile();

</script>


</body>

</html>
