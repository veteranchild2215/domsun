<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>profil - DOMSUN</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

<style>
.avatar {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 0;
  display: block;
  margin-top: 10px;
}

.friend {
  padding: 8px;
  margin: 5px 0;
  border: 1px solid #888;
}

.error {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>mon profil</h1>

<div class="box">

  <p id="status">chargement du profil...</p>

  <p>photo profil:</p>

  <input
    type="file"
    id="img"
    accept="image/*"
  >

  <br><br>

  <p>pseudo:</p>

  <input
    id="pseudo"
    placeholder="ton pseudo"
  >

  <br><br>

  <p>bio:</p>

  <textarea
    id="bio"
    placeholder="je sui domsun tro for"
  ></textarea>

  <br><br>

  <button onclick="saveProfile()">
    sauver profil
  </button>

  <h2>preview</h2>

  <img
    id="preview"
    class="avatar"
    style="display:none;"
  >

  <p id="showpseudo"></p>
  <p id="showbio"></p>

</div>


<div class="box">

  <h2>amis</h2>

  <input
    id="friendname"
    placeholder="pseudo ami"
  >

  <button onclick="addFriend()">
    ajouter
  </button>

  <div id="friends">
    chargement...
  </div>

</div>


<a class="nav" href="index.html">accueil</a>

<a class="nav" href="forum.html">forum</a>

<a class="nav" href="dm.html">messages</a>


<script>

const statusText =
  document.getElementById("status");



function escapeHtml(text) {

  return String(text || "").replace(
    /[&<>"']/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c];

    }
  );

}



async function loadProfile() {

  statusText.textContent =
    "chargement du profil...";

  const {
    data: userData,
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    statusText.textContent =
      "tu dois être connecté pour voir ton profil";

    return;
  }


  const user = userData.user;


  

  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();


  if (profileError) {

    console.error(profileError);

    statusText.textContent =
      "erreur profil: " +
      profileError.message;

    return;
  }




  if (!profile) {

    const username =
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "user";


    const {
      data: newProfile,
      error: createError
    } = await supabaseClient
      .from("profiles")
      .insert({

        id: user.id,

        username: username

      })
      .select()
      .maybeSingle();


    if (createError) {

      console.error(createError);

      statusText.textContent =
        "profil manquant et impossible à créer: " +
        createError.message;

      return;
    }


    loadProfileData(newProfile);

    statusText.textContent =
      "profil créé automatiquement";

    return;
  }


 

  loadProfileData(profile);

  statusText.textContent = "";

}




function loadProfileData(profile) {

  const username =
    profile.username || "anonymous";

  const bio =
    profile.bio || "";

  document.getElementById("pseudo").value =
    username;

  document.getElementById("bio").value =
    bio;

  document.getElementById("showpseudo").textContent =
    "pseudo: " + username;

  document.getElementById("showbio").textContent =
    "bio: " + bio;


  if (profile.avatar) {

    const preview =
      document.getElementById("preview");

    preview.src =
      profile.avatar;

    preview.style.display =
      "block";
  }

}




async function saveProfile() {

  const pseudo =
    document.getElementById("pseudo")
      .value
      .trim();

  const bio =
    document.getElementById("bio")
      .value
      .trim();


  if (!pseudo) {

    statusText.textContent =
      "mets un pseudo";

    return;
  }


  statusText.textContent =
    "sauvegarde...";


  const {
    data: userData,
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    statusText.textContent =
      "tu dois être connecté";

    return;
  }


  const user =
    userData.user;




  let avatarUrl = null;

  const file =
    document.getElementById("img").files[0];


  if (file) {

    if (!file.type.startsWith("image/")) {

      statusText.textContent =
        "le fichier doit être une image";

      return;
    }


    if (file.size > 15 * 1024 * 1024) {

      statusText.textContent =
        "image trop grosse (maximum 15 MB)";

      return;
    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =
      "avatars/" +
      user.id +
      "/" +
      Date.now() +
      "_" +
      safeName;


  

    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from("media")
      .upload(
        filePath,
        file,
        {
          contentType: file.type,
          cacheControl: "3600",
          upsert: false
        }
      );


    if (uploadError) {

      statusText.textContent =
        "erreur avatar: " +
        uploadError.message;

      return;
    }


    const {
      data: publicData
    } = supabaseClient
      .storage
      .from("media")
      .getPublicUrl(filePath);


    avatarUrl =
      publicData.publicUrl;

  }



  const updateData = {

    username: pseudo,

    bio: bio

  };


  if (avatarUrl) {

    updateData.avatar =
      avatarUrl;

  }


  const {
    data: updatedProfile,
    error: updateError
  } = await supabaseClient
    .from("profiles")
    .update(updateData)
    .eq("id", user.id)
    .select()
    .maybeSingle();


  if (updateError) {

    /*
    If the row disappeared for some reason,
    create it instead.
    */

    const {
      error: insertError
    } = await supabaseClient
      .from("profiles")
      .insert({

        id: user.id,

        username: pseudo,

        bio: bio,

        avatar: avatarUrl

      });


    if (insertError) {

      statusText.textContent =
        "erreur sauvegarde: " +
        insertError.message;

      return;
    }

  }



  document.getElementById("showpseudo")
    .textContent =
    "pseudo: " + pseudo;

  document.getElementById("showbio")
    .textContent =
    "bio: " + bio;


  if (avatarUrl) {

    const preview =
      document.getElementById("preview");

    preview.src =
      avatarUrl;

    preview.style.display =
      "block";
  }


  statusText.textContent =
    "profil sauvegardé !";


  setTimeout(function() {

    statusText.textContent = "";

  }, 1500);

}



function addFriend() {

  const input =
    document.getElementById("friendname");

  const name =
    input.value.trim();


  if (!name) return;


  const list =
    JSON.parse(
      localStorage.getItem("friends") ||
      "[]"
    );


  if (!list.includes(name)) {

    list.push(name);

  }


  localStorage.setItem(
    "friends",
    JSON.stringify(list)
  );


  input.value = "";

  showFriends();

}


function showFriends() {

  const list =
    JSON.parse(
      localStorage.getItem("friends") ||
      "[]"
    );


  const container =
    document.getElementById("friends");


  if (list.length === 0) {

    container.innerHTML =
      "<p>pas dami encore</p>";

    return;
  }


  container.innerHTML =
    list.map(function(name) {

      return `
        <div class="friend">

          <b>
            ${escapeHtml(name)}
          </b>

          <button
            onclick="location.href='dm.html?to=${encodeURIComponent(name)}'"
          >
            message
          </button>

        </div>
      `;

    }).join("");

}


loadProfile();

showFriends();

</script>

</body>
</html>
