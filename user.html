<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>profil utilisateur</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
</head>

<body>

<h1>profil utilisateur</h1>

<div class="box" id="profileBox">
  chargement...
</div>

<a class="nav" href="forum.html">forum</a>
<a class="nav" href="index.html">accueil</a>

<script>

function escapeHtml(s){

  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));

}


async function loadUser(){

  const params =
    new URLSearchParams(location.search);

  const id = params.get("id");

  if(!id){

    profileBox.innerHTML =
      "<p>aucun utilisateur selectionne.</p>";

    return;
  }

  const { data: profile, error } =
    await supabaseClient
      .from("profiles")
      .select("id, username, avatar, bio, created_at")
      .eq("id", id)
      .maybeSingle();

  if(error){

    profileBox.innerHTML =
      "<p>erreur: " +
      escapeHtml(error.message) +
      "</p>";

    return;
  }

  if(!profile){

    profileBox.innerHTML =
      "<p>profil introuvable.</p>";

    return;
  }

  let avatarHTML = "";

  if(profile.avatar){

    avatarHTML =
      '<img class="avatar" ' +
      'style="width:96px;height:96px;border-radius:0" ' +
      'src="' + escapeHtml(profile.avatar) + '">';
  }

  profileBox.innerHTML = `

    ${avatarHTML}

    <h2>${escapeHtml(profile.username)}</h2>

    <p>
      ${escapeHtml(profile.bio || "aucune bio")}
    </p>

    <p>
      membre depuis:
      ${profile.created_at
        ? new Date(profile.created_at).toLocaleDateString("fr-FR")
        : "inconnu"}
    </p>

    <a class="nav"
       href="dm.html?to=${encodeURIComponent(profile.username)}">
       envoyer un message
    </a>

  `;

}


loadUser();

</script>

</body>
</html>
