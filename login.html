<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>Connexion domsun</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>Connexion</h1>

<div class="box">

<input
  id="email"
  type="email"
  placeholder="email"
  required
>

<br><br>

<input
  id="pass"
  type="password"
  placeholder="mot de passe"
  required
>

<br><br>

<button onclick="login()">
  se connecter
</button>

<p id="msg"></p>

</div>

<a class="nav" href="index.html">
  ⬅ accueil
</a>

<script>

const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const pass =
    document.getElementById("pass").value;

  const msg =
    document.getElementById("msg");


  if (!email || !pass) {

    msg.textContent =
      "Remplis tous les champs.";

    return;

  }


  msg.textContent =
    "Connexion...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: pass

    });


  if (error) {

    console.error(error);

    msg.textContent =
      "Email ou mot de passe incorrect.";

    return;

  }


  const pseudo =
    data.user.user_metadata?.pseudo ||
    "anonymous";


  localStorage.setItem(
    "pseudo",
    pseudo
  );

  localStorage.setItem(
    "logged",
    "1"
  );


  msg.textContent =
    "Connecté !";


  setTimeout(() => {

    window.location.href =
      "index.html";

  }, 500);

}

</script>

</body>
</html>
