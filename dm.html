```html
<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>messages</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>messages privés</h1>

<div class="box">

<p id="status">
connexion...
</p>

<input
  id="to"
  placeholder="pseudo a qui"
>

<br><br>

<input
  id="msg"
  placeholder="ton mesag"
>

<button onclick="sendDM()">
  envoyer
</button>

</div>

<div id="chat"></div>

<a class="nav" href="index.html">
  accueil
</a>


<script>


const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

/*
   PASTE YOUR SUPABASE
   PUBLISHABLE KEY HERE
*/

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



let currentUser = null;
let currentUsername = null;




function esc(s) {

  return String(s).replace(
    /[&<>"']/g,

    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])

  );

}




async function start() {

  const status =
    document.getElementById("status");


  /* Get Supabase session */

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    status.textContent =
      "erreur de connexion";

    return;
  }


  /* No session */

  if (!data.session) {

    status.textContent =
      "pas connecte a Supabase. Connecte-toi avec login.";

    return;
  }



  currentUser =
    data.session.user;


  currentUsername =
    currentUser.user_metadata?.pseudo ||
    localStorage.getItem("pseudo") ||
    "anonymous";


  localStorage.setItem(
    "pseudo",
    currentUsername
  );

  localStorage.setItem(
    "logged",
    "1"
  );


  status.textContent =
    "connecte en tant que " +
    currentUsername;


 

  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("id, username")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (!profile) {

    const {
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: currentUser.id,

        username: currentUsername

      });


    if (profileError) {

      console.error(
        "profile error:",
        profileError
      );

    }

  }


  await showDM();

}



async function findUser(username) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id, username")
      .eq("username", username)
      .maybeSingle();


  if (error) {

    console.error(error);

    return null;
  }


  return data;

}



async function sendDM() {

  if (!currentUser) {

    alert(
      "tu dois etre connecte"
    );

    return;
  }


  const to =
    document
      .getElementById("to")
      .value.trim();

  const message =
    document
      .getElementById("msg")
      .value.trim();


  if (!to || !message) {

    return;
  }


  /* Find recipient */

  const recipient =
    await findUser(to);


  if (!recipient) {

    alert(
      "ce pseudo n'existe pas"
    );

    return;
  }


  /* Don't message yourself */

  if (recipient.id === currentUser.id) {

    alert(
      "tu ne peux pas t'envoyer un message"
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("direct_messages")
      .insert({

        sender_id:
          currentUser.id,

        recipient_id:
          recipient.id,

        sender_username:
          currentUsername,

        recipient_username:
          recipient.username,

        content:
          message

      });


  if (error) {

    console.error(error);

    alert(
      "erreur: " + error.message
    );

    return;
  }


  document.getElementById("msg")
    .value = "";


  await showDM();

}


async function showDM() {

  if (!currentUser) {

    return;
  }


  const chat =
    document.getElementById("chat");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("direct_messages")
      .select("*")
      .or(
        "sender_id.eq." +
        currentUser.id +
        ",recipient_id.eq." +
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    chat.innerHTML =
      "<div class='box'>erreur chargement des messages</div>";

    return;
  }


  if (!data || data.length === 0) {

    chat.innerHTML =
      "<div class='box'>pas de mesag</div>";

    return;
  }


  chat.innerHTML =
    data.map(x => {

      const date =
        new Date(
          x.created_at
        ).toLocaleString();


      return `
        <div class="box">
          <p>
            <b>
              ${esc(x.sender_username)}
              →
              ${esc(x.recipient_username)}
            </b>
          </p>

          <p>
            ${esc(x.content)}
          </p>

          <small>
            ${esc(date)}
          </small>
        </div>
      `;

    }).join("");

}


start();

</script>

</body>
</html>
