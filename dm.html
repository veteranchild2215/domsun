<script>



const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



const status =
document.getElementById("status");

const chat =
document.getElementById("chat");


let currentUser = null;
let myUsername = "";




function esc(s) {

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );

}



async function start() {

  status.textContent =
    "vérification de la connexion...";


  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session || !session.user) {

    status.textContent =
      "pas connecté";

    chat.innerHTML =
      "<div class='box'>" +
      "Tu dois être connecté pour utiliser les messages." +
      "<br><br>" +
      "<a class='nav' href='login.html'>se connecter</a>" +
      "</div>";

    return;

  }


  currentUser =
    session.user;


  myUsername =
    currentUser.user_metadata?.pseudo ||
    localStorage.getItem("pseudo") ||
    "anonymous";


  localStorage.setItem(
    "pseudo",
    myUsername
  );


  /*
    Make sure the user exists
    in the profiles table.
  */

  const {
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          id: currentUser.id,
          username: myUsername
        },
        {
          onConflict: "id"
        }
      );


  if (profileError) {

    console.error(profileError);

    status.textContent =
      "connecté";

    console.warn(
      "Profil non créé:",
      profileError.message
    );

  } else {

    status.textContent =
      "connecté en tant que " +
      myUsername;

  }


  await showDM();

}




async function findUser(username) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id, username")
      .eq("username", username)
      .maybeSingle();


  if (error) {

    console.error(error);

    return null;

  }


  return data;

}



async function sendDM() {

  if (!currentUser) {

    alert(
      "Connecte-toi d'abord."
    );

    return;

  }


  const recipientUsername =
    document.getElementById("to")
      .value
      .trim();


  const message =
    document.getElementById("msg")
      .value
      .trim();


  if (!recipientUsername || !message) {

    return;

  }


  if (
    recipientUsername.toLowerCase() ===
    myUsername.toLowerCase()
  ) {

    alert(
      "Tu ne peux pas t'envoyer un message à toi-même."
    );

    return;

  }


  const recipient =
    await findUser(recipientUsername);


  if (!recipient) {

    alert(
      "Utilisateur introuvable."
    );

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("direct_messages")
      .insert({

        sender_id:
          currentUser.id,

        recipient_id:
          recipient.id,

        sender_username:
          myUsername,

        recipient_username:
          recipient.username,

        content:
          message

      });


  if (error) {

    console.error(error);

    alert(
      "Impossible d'envoyer le message:\n\n" +
      error.message
    );

    return;

  }


  document.getElementById("msg")
    .value = "";

  await showDM();

}



async function showDM() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("direct_messages")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    chat.innerHTML =
      "<div class='box'>" +
      "Erreur: " +
      esc(error.message) +
      "</div>";

    return;

  }


  const messages =
    (data || []).filter(
      message =>
        message.sender_id === currentUser.id ||
        message.recipient_id === currentUser.id
    );


  if (messages.length === 0) {

    chat.innerHTML =
      "<div class='box'>" +
      "pas de mesag" +
      "</div>";

    return;

  }


  chat.innerHTML =
    messages.map(message => {

      return `
        <div class="box">

          <b>
            ${esc(message.sender_username)}
            →
            ${esc(message.recipient_username)}
          </b>

          <p>
            ${esc(message.content)}
          </p>

        </div>
