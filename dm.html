<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>messages</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

</head>

<body>

<h1>messages privés</h1>

<div class="box">

<p id="status">chargement...</p>

<input id="to" placeholder="pseudo a qui">

<br>

<input id="msg" placeholder="ton mesag">

<button id="sendButton">envoyer</button>

</div>


<div id="chat"></div>


<a class="nav" href="index.html">accueil</a>

<a class="nav" href="forum.html">forum</a>

<a class="nav" href="profil.html">profil</a>


<script>

const statusBox = document.getElementById("status");
const chat = document.getElementById("chat");

const toInput = document.getElementById("to");
const msgInput = document.getElementById("msg");
const sendButton = document.getElementById("sendButton");

let currentUser = null;
let currentProfile = null;


function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


// LOGIN
async function loadUser(){

  const { data, error } =
    await supabaseClient.auth.getUser();

  if(error){

    statusBox.textContent =
      "erreur: " + error.message;

    return;

  }


  currentUser = data.user;


  if(!currentUser){

    statusBox.textContent =
      "pas connecté";

    return;

  }


  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar")
      .eq("id", currentUser.id)
      .maybeSingle();


  if(profileError){

    statusBox.textContent =
      "erreur profil: " +
      profileError.message;

    return;

  }


  currentProfile = profile;


  statusBox.textContent =
    "connecté: " +
    profile.username;


  showDM();

}


// SHOW MESSAGES
async function showDM(){

  if(!currentUser) return;


  chat.innerHTML =
    "<div class='box'>chargement...</div>";


  const { data, error } =
    await supabaseClient
      .from("direct_messages")
      .select("*")
      .or(
        "sender_id.eq." +
        currentUser.id +
        ",recipient_id.eq." +
        currentUser.id
      )
      .order("created_at", {
        ascending:false
      });


  if(error){

    chat.innerHTML =
      "<div class='box'>" +
      "<b>erreur messages:</b><br>" +
      esc(error.message) +
      "</div>";

    return;

  }


  if(!data || data.length === 0){

    chat.innerHTML =
      "<div class='box'>pas de mesag</div>";

    return;

  }


  chat.innerHTML = data.map(x => {

    const mine =
      x.sender_id === currentUser.id;


    return `

      <div class="box">

        <p>
          <b>
            ${esc(x.sender_username)}
            →
            ${esc(x.recipient_username)}
          </b>
        </p>

        <p>
          ${esc(x.content)}
        </p>

        <small>
          ${esc(new Date(x.created_at).toLocaleString())}
        </small>

        ${
          mine
          ?
          `<br>
           <button
             onclick="deleteDM(${x.id})">
             supprimer
           </button>`
          :
          ""
        }

      </div>

    `;

  }).join("");

}


// SEND
sendButton.addEventListener(
  "click",
  async () => {

    if(!currentUser || !currentProfile){

      alert("connecte toi d'abord");

      return;

    }


    const username =
      toInput.value.trim();

    const message =
      msgInput.value.trim();


    if(!username || !message){

      alert("rempli les deux champs");

      return;

    }


    sendButton.disabled = true;


    const { data: recipient, error } =
      await supabaseClient
        .from("profiles")
        .select("id,username")
        .eq("username", username)
        .maybeSingle();


    if(error){

      alert(error.message);

      sendButton.disabled = false;

      return;

    }


    if(!recipient){

      alert("utilisateur introuvable");

      sendButton.disabled = false;

      return;

    }


    const { error: sendError } =
      await supabaseClient
        .from("direct_messages")
        .insert({

          sender_id: currentUser.id,

          recipient_id: recipient.id,

          sender_username:
            currentProfile.username,

          recipient_username:
            recipient.username,

          content: message

        });


    if(sendError){

      alert(
        "erreur: " +
        sendError.message
      );

    }
    else{

      msgInput.value = "";

      showDM();

    }


    sendButton.disabled = false;

  }
);


// DELETE
async function deleteDM(id){

  if(!confirm("supprimer ce message ?")){

    return;

  }


  const { error } =
    await supabaseClient
      .from("direct_messages")
      .delete()
      .eq("id", id)
      .eq("sender_id", currentUser.id);


  if(error){

    alert(
      "erreur suppression: " +
      error.message
    );

    return;

  }


  showDM();

}


loadUser();

</script>

</body>
</html>
