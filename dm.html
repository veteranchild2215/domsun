<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages - DOMSUN</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="theme.js"></script>
</head>

<body>

<div class="container">

  <h1>Private Messages</h1>

  <p>
    <a href="index.html">Home</a> |
    <a href="forum.html">Forum</a> |
    <a href="dm.html">Messages</a> |
    <a href="profil.html">Profile</a>
  </p>

  <hr>

  <div id="status">Loading...</div>

  <div id="messageArea" style="display:none;">

    <h2>Send a message</h2>

    <input
      id="recipient"
      type="text"
      placeholder="Username"
      style="width:100%;"
    >

    <br><br>

    <textarea
      id="message"
      rows="5"
      placeholder="Write your message..."
      style="width:100%;"
    ></textarea>

    <br><br>

    <button id="sendButton">Send</button>

    <hr>

    <h2>Your messages</h2>

    <div id="messages">
      Loading messages...
    </div>

  </div>

</div>


<script>

const statusBox = document.getElementById("status");
const messageArea = document.getElementById("messageArea");

const recipientInput = document.getElementById("recipient");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("sendButton");
const messagesBox = document.getElementById("messages");

let currentUser = null;
let currentProfile = null;


function escapeHTML(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// Load account
async function loadUser() {

  try {

    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error) {
      throw error;
    }

    currentUser = data.user;


    if (!currentUser) {

      statusBox.innerHTML =
        "<b>You are not logged in.</b>";

      messageArea.style.display = "none";

      return;

    }


    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("id, username, avatar")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    if (!profile) {

      statusBox.innerHTML =
        "<span style='color:red;'>Your profile was not found.</span>";

      return;

    }


    currentProfile = profile;


    statusBox.innerHTML =
      "Connected as <b>" +
      escapeHTML(profile.username) +
      "</b>";

    messageArea.style.display = "block";


  } catch (error) {

    console.error(error);

    statusBox.innerHTML =
      "<span style='color:red;'>" +
      "Error loading account: " +
      escapeHTML(error.message) +
      "</span>";

  }

}


// Load messages
async function loadMessages() {

  messagesBox.innerHTML = "Loading messages...";


  try {

    const { data, error } =
      await supabaseClient
        .from("direct_messages")
        .select("*")
        .or(
          `sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`
        )
        .order("created_at", {
          ascending: false
        });


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      messagesBox.innerHTML =
        "<p>No messages yet.</p>";

      return;

    }


    messagesBox.innerHTML = data.map(msg => {

      const date =
        new Date(msg.created_at).toLocaleString();


      return `

        <div
          style="
            border:1px solid #888;
            padding:12px;
            margin:10px 0;
          "
        >

          <div>

            <b>
              ${escapeHTML(msg.sender_username)}
            </b>

            →
            
            <b>
              ${escapeHTML(msg.recipient_username)}
            </b>

          </div>

          <small>
            ${escapeHTML(date)}
          </small>

          <p>
            ${escapeHTML(msg.content)}
          </p>

        </div>

      `;

    }).join("");


  } catch (error) {

    console.error(error);

    messagesBox.innerHTML =
      `<p style="color:red;">
        Error loading messages:
        ${escapeHTML(error.message)}
      </p>`;

  }

}


// Send message
sendButton.addEventListener("click", async () => {

  if (!currentUser || !currentProfile) {

    alert("You must be logged in.");

    return;

  }


  const recipientUsername =
    recipientInput.value.trim();

  const content =
    messageInput.value.trim();


  if (!recipientUsername || !content) {

    alert(
      "Enter a username and write a message."
    );

    return;

  }


  if (
    recipientUsername.toLowerCase() ===
    currentProfile.username.toLowerCase()
  ) {

    alert("You cannot send a message to yourself.");

    return;

  }


  sendButton.disabled = true;

  sendButton.textContent = "Sending...";


  try {

    // Find recipient
    const { data: recipient, error: recipientError } =
      await supabaseClient
        .from("profiles")
        .select("id, username")
        .eq("username", recipientUsername)
        .maybeSingle();


    if (recipientError) {
      throw recipientError;
    }


    if (!recipient) {

      alert(
        "No user exists with that username."
      );

      return;

    }


    // Insert message
    const { error } =
      await supabaseClient
        .from("direct_messages")
        .insert({

          sender_id: currentUser.id,

          recipient_id: recipient.id,

          sender_username: currentProfile.username,

          recipient_username: recipient.username,

          content: content

        });


    if (error) {
      throw error;
    }


    messageInput.value = "";

    await loadMessages();


  } catch (error) {

    console.error(error);

    alert(
      "Could not send message:\n\n" +
      error.message
    );

  }


  sendButton.disabled = false;

  sendButton.textContent = "Send";

});


// Start
(async () => {

  await loadUser();

  if (currentUser) {
    await loadMessages();
  }

})();

</script>

</body>
</html>
