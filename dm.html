<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>messages privés</title>
<link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>messages privés</h1>
<div class="box" id="composer">
<p id="who">chargement...</p>
<input id="to" placeholder="pseudo a qui"><br>
<input id="msg" placeholder="ton mesag" maxlength="2000">
<button onclick="sendDM()">envoyer</button>
<p id="status"></p>
</div>
<div id="chat"></div>
<a class="nav" href="index.html">accueil</a>
<a class="nav" href="profil.html">profil</a>
<a class="nav" href="forum.html">forum</a>

<script>
const SUPABASE_URL="https://cwmlajtwhriqjoopknsp.supabase.co";
const SUPABASE_KEY="sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));}
function avatarHtml(a,u){return a?`<img class="avatar" style="width:36px;height:36px;vertical-align:middle;object-fit:cover" src="${esc(a)}" alt="${esc(u)}"> `:"";}

async function load(){
 const {data:authData}=await supabaseClient.auth.getUser();
 currentUser=authData?.user||null;
 if(!currentUser){
   composer.innerHTML=`<p>connecte-toi pour utiliser les messages privés.</p><a class="nav" href="login.html">login</a>`;
   return;
 }
 const {data:profile,error}=await supabaseClient.from("profiles")
   .select("id,username,avatar").eq("id",currentUser.id).maybeSingle();
 if(error||!profile){who.textContent="profil introuvable.";return;}
 currentProfile=profile;who.textContent="connecte: "+profile.username;

 const targetId=new URLSearchParams(location.search).get("user");
 if(targetId){
   const {data:target}=await supabaseClient.from("profiles").select("username")
     .eq("id",targetId).maybeSingle();
   if(target)to.value=target.username;
 }
 await showDM();
}

async function findUser(username){
 const {data}=await supabaseClient.from("profiles").select("id,username,avatar")
   .eq("username",username).maybeSingle();
 return data||null;
}

async function sendDM(){
 if(!currentUser||!currentProfile){location.href="login.html";return;}
 const toName=to.value.trim(),text=msg.value.trim();
 if(!toName||!text)return;
 const recipient=await findUser(toName);
 if(!recipient){status.textContent="ce pseudo n'existe pas.";return;}
 if(recipient.id===currentUser.id){status.textContent="tu ne peux pas t'envoyer un message.";return;}

 const {error}=await supabaseClient.from("direct_messages").insert({
   sender_id:currentUser.id,recipient_id:recipient.id,
   sender_username:currentProfile.username,recipient_username:recipient.username,
   content:text
 });
 if(error){status.textContent=error.message;return;}
 msg.value="";status.textContent="";await showDM();
}

async function showDM(){
 const {data:messages,error}=await supabaseClient.from("direct_messages")
   .select("id,sender_id,recipient_id,sender_username,recipient_username,content,created_at")
   .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
   .order("created_at",{ascending:true});

 if(error){chat.innerHTML=`<div class="box">erreur: ${esc(error.message)}</div>`;return;}
 if(!messages?.length){chat.innerHTML="<div class='box'>pas de mesag</div>";return;}

 const ids=[...new Set(messages.flatMap(m=>[m.sender_id,m.recipient_id]))];
 let avatars={};
 if(ids.length){
   const {data:profiles}=await supabaseClient.from("profiles").select("id,avatar").in("id",ids);
   for(const p of (profiles||[]))avatars[p.id]=p.avatar;
 }

 chat.innerHTML=messages.map(m=>`
   <div class="box">
     <p>${avatarHtml(avatars[m.sender_id],m.sender_username)}
       <a href="user.html?id=${encodeURIComponent(m.sender_id)}"><b>${esc(m.sender_username)}</b></a>
       →
       <a href="user.html?id=${encodeURIComponent(m.recipient_id)}"><b>${esc(m.recipient_username)}</b></a>
     </p>
     <p>${esc(m.content)}</p>
     <small>${new Date(m.created_at).toLocaleString()}</small>
   </div>`).join("");
}
load();
</script>
</body>
</html>
