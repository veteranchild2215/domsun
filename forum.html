<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><title>forum</title>
<link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>forsun</h1>
<div class="box">
<p id="welcome">chargement...</p>
<input id="msg" placeholder="ecri ton mesag" maxlength="1000">
<button onclick="send()">envoyer</button>
<p id="status"></p>
</div>
<div id="chat"></div>
<a class="nav" href="index.html">accueil</a>
<a class="nav" href="profil.html">profil</a>
<a class="nav" href="dm.html">messages</a>

<script>
const SUPABASE_URL="https://cwmlajtwhriqjoopknsp.supabase.co";
const SUPABASE_KEY="sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));}

function avatarHtml(a,u){
 if(!a)return "";
 return `<img class="avatar" style="width:40px;height:40px;vertical-align:middle;object-fit:cover" src="${esc(a)}" alt="${esc(u)}"> `;
}

async function load(){
 const {data:authData}=await supabaseClient.auth.getUser();
 currentUser=authData?.user||null;

 if(!currentUser){
   welcome.textContent="tu dois etre connecte pour poster.";
   msg.disabled=true;
   document.querySelector('button[onclick="send()"]').disabled=true;
   return render();
 }

 const {data:profile,error}=await supabaseClient.from("profiles")
   .select("id,username,avatar,is_admin,is_moderator")
   .eq("id",currentUser.id).maybeSingle();

 if(error||!profile){welcome.textContent="profil introuvable.";return;}
 currentProfile=profile;
 welcome.textContent="connecte: "+profile.username;
 await render();
}

async function render(){
 const {data:posts,error}=await supabaseClient.from("forum_posts")
   .select("id,user_id,username,avatar,content,created_at")
   .order("created_at",{ascending:true});

 if(error){chat.innerHTML=`<div class="box">erreur: ${esc(error.message)}</div>`;return;}
 if(!posts?.length){chat.innerHTML="<div class='box'>pa de mesag</div>";return;}

 chat.innerHTML=posts.map(p=>{
   const canDelete=currentProfile&&(currentProfile.is_admin===true||currentProfile.is_moderator===true);
   return `<div class="box">
     <p>${avatarHtml(p.avatar,p.username)}
       <a href="user.html?id=${encodeURIComponent(p.user_id||"")}"><b>${esc(p.username)}</b></a>
     </p>
     <p>${esc(p.content)}</p>
     <small>${new Date(p.created_at).toLocaleString()}</small>
     ${canDelete?`<br><button onclick="deletePost(${p.id})">supprimer</button>`:""}
   </div>`;
 }).join("");
}

async function send(){
 if(!currentUser||!currentProfile){location.href="login.html";return;}
 const text=msg.value.trim(); if(!text)return;

 const {error}=await supabaseClient.from("forum_posts").insert({
   user_id:currentUser.id,
   username:currentProfile.username,
   avatar:currentProfile.avatar||null,
   content:text
 });
 if(error){status.textContent=error.message;return;}
 msg.value="";status.textContent="";await render();
}

async function deletePost(id){
 if(!currentProfile||(currentProfile.is_admin!==true&&currentProfile.is_moderator!==true))return;
 if(!confirm("supprimer ce message ?"))return;
 const {error}=await supabaseClient.from("forum_posts").delete().eq("id",id);
 if(error){alert("suppression refusee: "+error.message);return;}
 await render();
}
load();
</script>
</body>
</html>
