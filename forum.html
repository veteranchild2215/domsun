<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>DOMSUN Forum</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

</head>

<body>

<h1>DOMSUN Forum</h1>


<div class="box">

  <p id="loginInfo">chargement...</p>

  <input
    id="username"
    type="text"
    maxlength="30"
    placeholder="ton pseudo"
  >

  <br><br>

  <textarea
    id="msg"
    maxlength="2000"
    placeholder="écris ton message..."
    style="width:80%;height:100px;"
  ></textarea>

  <br><br>

  <input
    id="forumImage"
    type="file"
    accept="image/*"
  >

  <br><br>

  <button onclick="sendPost()">envoyer</button>

  <p id="status"></p>

</div>


<div id="chat">
  <div class="box">chargement...</div>
</div>


<br>

<a class="nav" href="index.html">accueil</a>
<a class="nav" href="profil.html">profil</a>
<a class="nav" href="dm.html">messages</a>


<script>


const chat =
  document.getElementById("chat");

const statusText =
  document.getElementById("status");

const usernameInput =
  document.getElementById("username");

const loginInfo =
  document.getElementById("loginInfo");




let currentUser = null;

let currentProfile = null;




function escapeHtml(text) {

  return String(text || "").replace(
    /[&<>"']/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c];

    }
  );

}



async function loadCurrentUser() {

  const {
    data: userData,
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError) {

    console.error(userError);

  }


  currentUser =
    userData && userData.user
      ? userData.user
      : null;




  if (!currentUser) {

    currentProfile = null;

    loginInfo.textContent =
      "Tu n'es pas connecté. Tu peux poster anonymement.";

    usernameInput.disabled = false;

    usernameInput.placeholder =
      "ton pseudo";

    return;

  }




  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, username, avatar, is_admin, is_moderator"
      )
      .eq("id", currentUser.id)
      .maybeSingle();


  if (profileError) {

    console.error(
      "Profile error:",
      profileError
    );

  }


  currentProfile = profile || null;


  /*
  If profile exists
  */

  if (currentProfile) {

    usernameInput.value =
      currentProfile.username || "";

    usernameInput.disabled = true;

    loginInfo.textContent =
      "connecté : " +
      currentProfile.username;

  }


  else {

    let fallbackName =
      currentUser.user_metadata &&
      currentUser.user_metadata.username
        ? currentUser.user_metadata.username
        : "user";


    usernameInput.value =
      fallbackName;

    usernameInput.disabled = true;

    loginInfo.textContent =
      "connecté : " +
      fallbackName;

  }

}


function getUsername() {



  if (currentUser) {

    if (currentProfile &&
        currentProfile.username) {

      return currentProfile.username
        .substring(0, 30);

    }


    if (
      currentUser.user_metadata &&
      currentUser.user_metadata.username
    ) {

      return currentUser.user_metadata.username
        .substring(0, 30);

    }


    return "user";

  }


  /*
  Anonymous
  */

  let name =
    usernameInput.value.trim();


  if (!name) {

    name = "anonymous";

  }


  return name.substring(0, 30);

}



async function sendPost() {

  const message =
    document.getElementById("msg")
      .value
      .trim();


  const username =
    getUsername();


  const imageFile =
    document.getElementById("forumImage")
      .files[0];


  if (!message && !imageFile) {

    statusText.textContent =
      "écris un message ou choisis une image";

    return;

  }


  if (imageFile) {

    if (!imageFile.type.startsWith("image/")) {

      statusText.textContent =
        "le fichier doit être une image";

      return;

    }


    if (imageFile.size > 10 * 1024 * 1024) {

      statusText.textContent =
        "image trop grosse (maximum 10 MB)";

      return;

    }

  }


  statusText.textContent =
    "envoi...";


  let imageUrl = null;



  if (imageFile) {

    const safeName =
      imageFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const folder =
      currentUser
        ? currentUser.id
        : "anonymous";


    const filePath =
      "forum/" +
      folder +
      "/" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 10) +
      "_" +
      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          imageFile,
          {
            contentType: imageFile.type,
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(uploadError);

      statusText.textContent =
        "erreur image: " +
        uploadError.message;

      return;

    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(filePath);


    imageUrl =
      publicData.publicUrl;

  }

  const avatar =
    currentProfile &&
    currentProfile.avatar
      ? currentProfile.avatar
      : null;



  const userId =
    currentUser
      ? currentUser.id
      : null;



  const {
    error: dbError
  } =
    await supabaseClient
      .from("forum_posts")
      .insert({

        user_id: userId,

        username: username,

        avatar: avatar,

        content: message || "",

        image_url: imageUrl

      });


  if (dbError) {

    console.error(dbError);

    statusText.textContent =
      "erreur message: " +
      dbError.message;

    return;

  }



  document.getElementById("msg")
    .value = "";

  document.getElementById("forumImage")
    .value = "";


  statusText.textContent =
    "message envoyé !";


  await loadPosts();


  setTimeout(function() {

    statusText.textContent = "";

  }, 1500);

}


async function deletePost(postId) {

  if (!confirm("Supprimer ce message ?")) {

    return;

  }


  statusText.textContent =
    "suppression...";


  const {
    error
  } =
    await supabaseClient
      .from("forum_posts")
      .delete()
      .eq("id", postId);


  if (error) {

    console.error(error);

    statusText.textContent =
      "erreur suppression: " +
      error.message;

    return;

  }


  statusText.textContent =
    "message supprimé !";


  await loadPosts();


  setTimeout(function() {

    statusText.textContent = "";

  }, 1500);

}



function render(posts) {

  if (!posts || posts.length === 0) {

    chat.innerHTML =
      "<div class='box'>" +
      "pas de messages" +
      "</div>";

    return;

  }


  chat.innerHTML =
    posts.map(function(post) {

      const username =
        escapeHtml(
          post.username || "anonymousmous"
        );


      const content =
        escapeHtml(
          post.content || ""
        );


      let avatarHTML = "";


      /*
      Avatar
      */

      if (post.avatar) {

        avatarHTML =

          "<img " +

          "src=\"" +
          escapeHtml(post.avatar) +
          "\" " +

          "alt=\"avatar\" " +

          "style=\"" +
          "width:50px;" +
          "height:50px;" +
          "object-fit:cover;" +
          "vertical-align:middle;" +
          "margin-right:10px;" +
          "border-radius:0;" +
          "\">";

      }


      /*
      Delete button
      */

      let deleteHTML = "";


      const isOwner =
        currentUser &&
        post.user_id &&
        post.user_id === currentUser.id;


      const isAdmin =
        currentProfile &&
        currentProfile.is_admin === true;


      const isModerator =
        currentProfile &&
        currentProfile.is_moderator === true;


      if (
        isOwner ||
        isAdmin ||
        isModerator
      ) {

        deleteHTML =

          "<br><br>" +

          "<button " +

          "onclick=\"deletePost(" +
          post.id +
          ")\">" +

          "supprimer" +

          "</button>";

      }


      /*
      Image
      */

      let imageHTML = "";


      if (post.image_url) {

        imageHTML =

          "<br>" +

          "<img " +

          "src=\"" +
          escapeHtml(post.image_url) +
          "\" " +

          "alt=\"image du forum\" " +

          "style=\"" +
          "max-width:500px;" +
          "max-height:500px;" +
          "width:auto;" +
          "height:auto;" +
          "margin-top:10px;" +
          "\">";

      }


      /*
      Date
      */

      let dateHTML = "";


      if (post.created_at) {

        const date =
          new Date(post.created_at);


        dateHTML =

          "<small>" +

          escapeHtml(
            date.toLocaleString("fr-FR")
          ) +

          "</small>";

      }


return (

  "<div class='box'>" +

    "<div>" +

      avatarHTML +

      "<a href=\"profil.html?user=" +
      encodeURIComponent(post.username) +
      "\">" +

      "<b>" +
      username +
      "</b>" +

      "</a>" +

    "</div>" +

    "<br>" +

    "<div>" +
      content +
    "</div>" +

    imageHTML +

    "<br>" +

    dateHTML +

    deleteHTML +

  "</div>"

);

    }).join("");

}



async function loadPosts() {

  chat.innerHTML =
    "<div class='box'>" +
    "chargement..." +
    "</div>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("forum_posts")
      .select(
        "id, user_id, username, avatar, content, image_url, created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Forum loading error:",
      error
    );


    chat.innerHTML =

      "<div class='box'>" +

        "<b>Erreur Supabase</b>" +

        "<br><br>" +

        escapeHtml(error.message) +

      "</div>";

    return;

  }


  render(data);

}


document
  .getElementById("msg")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendPost();

      }

    }
  );



async function startForum() {

  await loadCurrentUser();

  await loadPosts();

}


startForum();

</script>

</body>

</html>
