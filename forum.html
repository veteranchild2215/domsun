<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>forum</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

</head>

<body>

<h1>forsun</h1>

<div class="box">

<p id="welcome">chargement...</p>

<input
  id="msg"
  placeholder="ecri ton mesag"
>

<button id="sendButton">
envoyer
</button>

</div>


<div id="chat"></div>


<a class="nav" href="index.html">accueil</a>

<a class="nav" href="profil.html">profil</a>

<a class="nav" href="dm.html">messages</a>


<script>

const welcome =
  document.getElementById("welcome");

const msg =
  document.getElementById("msg");

const sendButton =
  document.getElementById("sendButton");

const chat =
  document.getElementById("chat");


let currentUser = null;
let currentProfile = null;


function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


async function loadUser(){

  const { data, error } =
    await supabaseClient.auth.getUser();


  if(error){

    welcome.textContent =
      "erreur: " + error.message;

    return;

  }


  currentUser = data.user;


  if(!currentUser){

    welcome.textContent =
      "pas connecté - connecte toi pour écrire";

    sendButton.disabled = true;

    msg.disabled = true;

    return;

  }


  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar,is_admin,is_moderator")
      .eq("id", currentUser.id)
      .maybeSingle();


  if(profileError){

    welcome.textContent =
      "erreur profil: " +
      profileError.message;

    return;

  }


  if(!profile){

    welcome.textContent =
      "profil introuvable";

    return;

  }


  currentProfile = profile;


  welcome.textContent =
    "connecté: " +
    profile.username;


  showPosts();

}


async function showPosts(){

  chat.innerHTML =
    "<div class='box'>chargement...</div>";


  const { data: posts, error } =
    await supabaseClient
      .from("forum_posts")
      .select(
        "id,user_id,username,avatar,content,created_at"
      )
      .order("created_at", {
        ascending:false
      });


  if(error){

    chat.innerHTML =
      "<div class='box'>" +
      "<b>erreur forum:</b><br>" +
      esc(error.message) +
      "</div>";

    return;

  }


  if(!posts || posts.length === 0){

    chat.innerHTML =
      "<div class='box'>pa de mesag</div>";

    return;

  }


  const ids = [
    ...new Set(
      posts
        .map(p => p.user_id)
        .filter(Boolean)
    )
  ];


  let profiles = [];


  if(ids.length > 0){

    const { data } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar,is_admin,is_moderator"
        )
        .in("id", ids);


    profiles = data || [];

  }


  const profileMap = {};


  profiles.forEach(p => {

    profileMap[p.id] = p;

  });


  chat.innerHTML =
    posts.map(post => {

      const profile =
        profileMap[post.user_id];


      const username =
        profile?.username ||
        post.username ||
        "anonymous";


      const avatar =
        profile?.avatar ||
        post.avatar;


      const date =
        new Date(
          post.created_at
        ).toLocaleString();


      let usernameHTML;


      if(post.user_id){

        usernameHTML =
          `<a href="user.html?id=${encodeURIComponent(post.user_id)}">
            <b>${esc(username)}</b>
          </a>`;

      }

      else{

        usernameHTML =
          `<b>${esc(username)}</b>`;

      }


      let avatarHTML = "";


      if(avatar){

        avatarHTML = `
          <img
            class="avatar"
            src="${esc(avatar)}"
            style="
              width:40px;
              height:40px;
              object-fit:cover;
              vertical-align:middle;
              margin-right:5px;
              border-radius:0;
            "
          >
        `;

      }


      let deleteHTML = "";


      if(currentProfile){

        const canDelete =
          currentProfile.is_admin ||
          currentProfile.is_moderator;


        if(canDelete){

          deleteHTML = `
            <br>
            <button
              onclick="deletePost(${post.id})">
              supprimer
            </button>
          `;

        }

      }


      return `

        <div class="box">

          <p>

            ${avatarHTML}

            ${usernameHTML}

          </p>


          <p>

            ${esc(post.content)}

          </p>


          <small>

            ${esc(date)}

          </small>


          ${deleteHTML}

        </div>

      `;

    }).join("");

}


sendButton.addEventListener(
  "click",
  async () => {

    if(!currentUser || !currentProfile){

      alert(
        "connecte toi pour écrire"
      );

      return;

    }


    const text =
      msg.value.trim();


    if(!text){

      return;

    }


    sendButton.disabled = true;


    const { error } =
      await supabaseClient
        .from("forum_posts")
        .insert({

          user_id:
            currentUser.id,

          username:
            currentProfile.username,

          avatar:
            currentProfile.avatar || null,

          content:
            text

        });


    if(error){

      alert(
        "erreur: " +
        error.message
      );

    }
    else{

      msg.value = "";

      showPosts();

    }


    sendButton.disabled = false;

  }
);


async function deletePost(id){

  if(!currentProfile){

    return;

  }


  const canDelete =
    currentProfile.is_admin ||
    currentProfile.is_moderator;


  if(!canDelete){

    alert(
      "tu n'as pas les droits"
    );

    return;

  }


  if(!confirm(
    "supprimer ce message ?"
  )){

    return;

  }


  const { error } =
    await supabaseClient
      .from("forum_posts")
      .delete()
      .eq("id", id);


  if(error){

    alert(
      "erreur suppression: " +
      error.message
    );

    return;

  }


  showPosts();

}


loadUser();

</script>

</body>
</html>
