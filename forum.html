<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DOMSUN Forum</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
</head>

<body>

<h1>DOMSUN Forum</h1>

<div class="box">
    <h2>Nouveau message</h2>

    <textarea
        id="content"
        placeholder="écris ton message..."
        style="width:90%;min-height:80px;"
    ></textarea>

    <br>

    <input
        type="file"
        id="forumImage"
        accept="image/*"
    >

    <br>

    <button onclick="sendPost()">envoyer</button>

    <p id="status"></p>
</div>

<div id="forum">
    <div class="box">chargement...</div>
</div>

<br>

<a class="nav" href="index.html">accueil</a>
<a class="nav" href="profil.html">profil</a>
<a class="nav" href="dm.html">messages</a>

<script>

const forum = document.getElementById("forum");
const statusText = document.getElementById("status");

function escapeHtml(text) {
    return String(text || "").replace(/[&<>"']/g, function(c) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[c];
    });
}


async function getCurrentUser() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error) {
        console.error(error);
        return null;
    }

    return data.user;
}


async function sendPost() {

    const user = await getCurrentUser();

    if (!user) {
        statusText.textContent =
            "tu dois être connecté pour poster";
        return;
    }

    const content =
        document.getElementById("content")
        .value
        .trim();

    const imageFile =
        document.getElementById("forumImage")
        .files[0];

    if (!content && !imageFile) {
        statusText.textContent =
            "écris quelque chose ou choisis une image";
        return;
    }

    statusText.textContent = "envoi...";




    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("username, avatar")
            .eq("id", user.id)
            .single();

    if (profileError) {

        statusText.textContent =
            "erreur profil: " + profileError.message;

        return;
    }


 

    let imageUrl = null;

    if (imageFile) {

        if (imageFile.size > 5 * 1024 * 1024) {

            statusText.textContent =
                "image trop grande (maximum 5 MB)";

            return;
        }

        if (!imageFile.type.startsWith("image/")) {

            statusText.textContent =
                "fichier non valide";

            return;
        }

        const safeName =
            imageFile.name
                .replace(/[^a-zA-Z0-9._-]/g, "_");

        const filePath =
            "forum/" +
            user.id +
            "/" +
            Date.now() +
            "_" +
            safeName;


        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("media")
                .upload(
                    filePath,
                    imageFile,
                    {
                        contentType: imageFile.type,
                        upsert: false
                    }
                );


        if (uploadError) {

            statusText.textContent =
                "erreur upload image: " +
                uploadError.message;

            return;
        }


        const { data: publicData } =
            supabaseClient
                .storage
                .from("media")
                .getPublicUrl(filePath);

        imageUrl =
            publicData.publicUrl;
    }


  

    const { error } =
        await supabaseClient
            .from("forum_posts")
            .insert({

                user_id: user.id,

                username:
                    profile.username,

                avatar:
                    profile.avatar || null,

                content:
                    content || "",

                image_url:
                    imageUrl

            });


    if (error) {

        statusText.textContent =
            "erreur: " + error.message;

        return;
    }


    document.getElementById("content").value = "";
    document.getElementById("forumImage").value = "";

    statusText.textContent =
        "message envoyé !";

    loadForum();
}


async function deletePost(id) {

    if (!confirm("supprimer ce message ?")) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("forum_posts")
            .delete()
            .eq("id", id);

    if (error) {

        alert(
            "erreur suppression: " +
            error.message
        );

        return;
    }

    loadForum();
}


async function loadForum() {

    forum.innerHTML =
        '<div class="box">chargement...</div>';


    const { data: posts, error } =
        await supabaseClient
            .from("forum_posts")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        forum.innerHTML =
            '<div class="box">Erreur loading forum: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }


    const { data: userData } =
        await supabaseClient.auth.getUser();

    const user =
        userData.user;


    let myProfile = null;

    if (user) {

        const { data } =
            await supabaseClient
                .from("profiles")
                .select("is_admin,is_moderator")
                .eq("id", user.id)
                .single();

        myProfile = data;
    }


    if (!posts || posts.length === 0) {

        forum.innerHTML =
            '<div class="box">aucun message</div>';

        return;
    }


    forum.innerHTML =
        posts.map(function(post) {

            let date = "";

            if (post.created_at) {

                date =
                    new Date(
                        post.created_at
                    ).toLocaleString("fr-FR");
            }


            let avatar = "";

            if (post.avatar) {

                avatar =
                    `<img
                        src="${escapeHtml(post.avatar)}"
                        style="
                            width:50px;
                            height:50px;
                            object-fit:cover;
                            border:1px solid #555;
                            border-radius:0;
                            display:block;
                            margin-bottom:5px;
                        "
                    >`;
            }


            let image = "";

            if (post.image_url) {

                image =
                    `<br>
                    <img
                        src="${escapeHtml(post.image_url)}"
                        style="
                            max-width:500px;
                            max-height:500px;
                            object-fit:contain;
                            border:1px solid #777;
                            border-radius:0;
                            margin-top:8px;
                        "
                    >`;
            }


            let deleteButton = "";

            if (
                myProfile &&
                (
                    myProfile.is_admin ||
                    myProfile.is_moderator
                )
            ) {

                deleteButton =
                    `<br>
                    <button
                        onclick="deletePost(${post.id})"
                    >
                        supprimer
                    </button>`;
            }


            let usernameHtml =
                escapeHtml(post.username);


            if (post.user_id) {

                usernameHtml =
                    `<a href="user.html?id=${encodeURIComponent(post.user_id)}">
                        ${escapeHtml(post.username)}
                    </a>`;
            }


            return `
                <div class="box">

                    ${avatar}

                    <b>${usernameHtml}</b>

                    <small>
                        — ${escapeHtml(date)}
                    </small>

                    <p>
                        ${escapeHtml(post.content)}
                    </p>

                    ${image}

                    ${deleteButton}

                </div>
            `;

        }).join("");
}


loadForum();

</script>

</body>
</html>
