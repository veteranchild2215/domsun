<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>DOMSUN Forum</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>

</head>


<body>

<h1>DOMSUN Forum</h1>


<div class="box">

  <p>
    Tu peux poster sans créer de compte.
  </p>

  <input
    id="username"
    type="text"
    maxlength="30"
    placeholder="ton pseudo"
  >

  <br><br>

  <textarea
    id="msg"
    maxlength="2000"
    placeholder="écris ton message..."
    style="width:80%;height:100px;"
  ></textarea>

  <br><br>

  <input
    id="forumImage"
    type="file"
    accept="image/*"
  >

  <br><br>

  <button onclick="sendPost()">
    envoyer
  </button>

  <p id="status"></p>

</div>


<div id="chat">
  <div class="box">
    chargement...
  </div>
</div>


<br>

<a class="nav" href="index.html">accueil</a>

<a class="nav" href="profil.html">profil</a>

<a class="nav" href="dm.html">messages</a>


<script>





const chat = document.getElementById("chat");

const statusText = document.getElementById("status");




function escapeHtml(text) {

  return String(text || "").replace(
    /[&<>"']/g,

    function(c) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[c];

    }

  );

}




function getUsername() {

  const input =
    document.getElementById("username");

  let name =
    input.value.trim();

  if (!name) {

    name = "anonymous";

  }

  return name.substring(0, 30);

}




async function sendPost() {

  const message =
    document.getElementById("msg")
      .value
      .trim();

  const username =
    getUsername();

  const imageFile =
    document.getElementById("forumImage")
      .files[0];


  /*
  Nothing to send
  */

  if (!message && !imageFile) {

    statusText.textContent =
      "écris un message ou choisis une image";

    return;

  }



  if (imageFile) {

    if (!imageFile.type.startsWith("image/")) {

      statusText.textContent =
        "le fichier doit être une image";

      return;

    }


    if (imageFile.size > 10 * 1024 * 1024) {

      statusText.textContent =
        "image trop grosse (maximum 10 MB)";

      return;

    }

  }


  statusText.textContent =
    "envoi...";


  let imageUrl = null;




  if (imageFile) {

    const safeName =
      imageFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =
      "forum/anonymous/" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 10) +
      "_" +
      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          imageFile,
          {
            contentType: imageFile.type,
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Image upload error:",
        uploadError
      );

      statusText.textContent =
        "erreur image: " +
        uploadError.message;

      return;

    }


    

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(filePath);


    imageUrl =
      publicData.publicUrl;

  }




  const {
    error: dbError
  } =
    await supabaseClient
      .from("forum_posts")
      .insert({

        user_id: null,

        username: username,

        avatar: null,

        content: message || "",

        image_url: imageUrl

      });


  if (dbError) {

    console.error(
      "Database error:",
      dbError
    );

    statusText.textContent =
      "erreur message: " +
      dbError.message;

    return;

  }


  /*
  Clear inputs
  */

  document.getElementById("msg")
    .value = "";

  document.getElementById("forumImage")
    .value = "";


  statusText.textContent =
    "message envoyé !";



  await loadPosts();


  setTimeout(function() {

    statusText.textContent = "";

  }, 1500);

}



function render(posts) {

  if (!posts || posts.length === 0) {

    chat.innerHTML =
      "<div class='box'>" +
      "pas de messages" +
      "</div>";

    return;

  }


  chat.innerHTML = posts.map(
    function(post) {

      const username =
        escapeHtml(
          post.username ||
          "anonymous"
        );


      const content =
        escapeHtml(
          post.content || ""
        );


      let imageHTML = "";


      /*
      Display image
      */

      if (post.image_url) {

        imageHTML =
          "<br>" +
          "<img " +
          "src=\"" +
          escapeHtml(post.image_url) +
          "\" " +
          "alt=\"image du forum\" " +
          "style=\"" +
          "max-width:500px;" +
          "max-height:500px;" +
          "width:auto;" +
          "height:auto;" +
          "margin-top:10px;" +
          "\">";

      }


      return (

        "<div class='box'>" +

          "<p>" +
            "<b>" +
              username +
            "</b>" +
          "</p>" +

          "<p>" +
            content +
          "</p>" +

          imageHTML +

        "</div>"

      );

    }
  ).join("");

}




async function loadPosts() {

  chat.innerHTML =
    "<div class='box'>" +
    "chargement..." +
    "</div>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("forum_posts")
      .select(
        "id, username, avatar, content, image_url, created_at"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Forum loading error:",
      error
    );


    chat.innerHTML =
      "<div class='box'>" +

        "<b>Erreur Supabase</b>" +

        "<br><br>" +

        escapeHtml(
          error.message
        ) +

      "</div>";

    return;

  }


  render(data);

}




document
  .getElementById("msg")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendPost();

      }

    }
  );



loadPosts();


</script>

</body>

</html>
