<!doctype html>

</head>

<body>

    placeholder="ecri ton mesag"

>

<script>



const SUPABASE_URL =
    "https://cwmlajtwhriqjoopknsp.supabase.co";



const SUPABASE_KEY =
    "sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



let currentUser = null;
let currentProfile = null;



function esc(text){

    return String(text).replace(
        /[&<>"']/g,
        function(c){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[c];

        }
    );

}



async function loadUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();


    if(error || !data.user){

        currentUser = null;

        document.getElementById("welcome").textContent =
            "connecte-toi pour poster";

        return;

    }


    currentUser = data.user;



    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("username,is_admin")
        .eq("id", currentUser.id)
        .maybeSingle();


    if(profileError){

        console.error(profileError);

        document.getElementById("welcome").textContent =
            "erreur profile";

        return;

    }


    currentProfile = profile;


    const username =
        profile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email ||
        "anonymous";


    document.getElementById("welcome").textContent =
        "connecte: " + username;



    loadPosts();

}



async function loadPosts(){

    const chat =
        document.getElementById("chat");


    chat.innerHTML =
        "<div class='box'>chargement...</div>";


    const {
        data: posts,
        error
    } = await supabaseClient
        .from("forum_posts")
        .select("*")
        .order("created_at", {
            ascending: true
        });


    if(error){

        console.error(error);

        chat.innerHTML =
            "<div class='box'>erreur chargement forum</div>";

        return;

    }


    if(!posts || posts.length === 0){

        chat.innerHTML =
            "<div class='box'>pa de mesag</div>";

        return;

    }


    chat.innerHTML =
        posts.map(renderPost).join("");

}



function renderPost(post){

    const username =
        post.username || "anonymous";


    const text =
        post.content || "";


    let date = "";

    if(post.created_at){

        const d =
            new Date(post.created_at);

        date =
            d.toLocaleString("fr-FR");

    }


    let adminButton = "";


    if(
        currentProfile &&
        currentProfile.is_admin === true
    ){

        adminButton = `
            <button
                onclick="deletePost(${post.id})"
            >
                DELETE
            </button>
        `;

    }


    return `

        <div class="box" id="post-${post.id}">

            <p>

                <b>
                    ${esc(username)}
                </b>

                <small>
                    ${esc(date)}
                </small>

            </p>

            <p>
                ${esc(text)}
            </p>

            ${adminButton}

        </div>

    `;

}


async function send(){

    const input =
        document.getElementById("msg");

    const status =
        document.getElementById("status");


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    if(!currentUser){

        status.textContent =
            "connecte-toi d'abord";

        return;

    }


    const username =
        currentProfile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email ||
        "anonymous";


    status.textContent =
        "envoi...";


    const {
        error
    } = await supabaseClient
        .from("forum_posts")
        .insert({

            username: username,

            content: text

        });


    if(error){

        console.error(error);

        status.textContent =
            "erreur: " + error.message;

        return;

    }


    input.value = "";

    status.textContent =
        "message envoye";


    loadPosts();

}



async function deletePost(id){

    /*
       Extra client-side check.

       The REAL protection is the Supabase
       RLS policy we created in SQL.
    */

    if(
        !currentProfile ||
        currentProfile.is_admin !== true
    ){

        alert(
            "tu n'es pas admin"
        );

        return;

    }


    const confirmed =
        confirm(
            "supprimer ce message ?"
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("forum_posts")
        .delete()
        .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "suppression refusee: " +
            error.message
        );

        return;

    }


    loadPosts();

}



document
    .getElementById("msg")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                send();

            }

        }
    );



loadUser();

</script>

</body>
</html>
