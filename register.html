<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>register</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>cree compte</h1>

<div class="box">

<input id="pseudo" placeholder="ton pseudo"><br>

<input id="email" type="email" placeholder="email"><br>

<input id="pass" type="password" placeholder="mot de passe"><br>

<button onclick="reg()">creer compte</button>

<p id="msg"></p>

</div>

<a class="nav" href="login.html">login</a>
<a class="nav" href="index.html">accueil</a>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* REGISTER */

async function reg() {

  const p =
    document.getElementById("pseudo").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const pass =
    document.getElementById("pass").value;

  if (!p || !email || !pass) {

    msg.textContent = "non rempli";
    return;

  }

  if (!email.includes("@")) {

    msg.textContent = "email invalide";
    return;

  }

  msg.textContent = "creation du compte...";


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: pass,

      options: {
        data: {
          pseudo: p
        }
      }

    });


  if (error) {

    console.error(error);

    msg.textContent =
      "erreur: " + error.message;

    return;

  }


 

  localStorage.setItem("pseudo", p);


  if (data.session) {

    localStorage.setItem("logged", "1");

    location.href = "profil.html";

  } else {

    msg.textContent =
      "compte cree ! verifie ton email puis connecte-toi.";

  }

}

</script>

</body>
</html>
