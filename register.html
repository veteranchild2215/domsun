```html
<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>Créer un compte - domsun</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>Créer un compte</h1>

<div class="box">

<input
  id="pseudo"
  type="text"
  placeholder="pseudo"
  required
>

<br><br>

<input
  id="email"
  type="email"
  placeholder="email"
  required
>

<br><br>

<input
  id="pass"
  type="password"
  placeholder="mot de passe"
  required
>

<br><br>

<input
  id="confirmPass"
  type="password"
  placeholder="confirme ton mot de passe"
  required
>

<br><br>

<button onclick="register()">
  créer mon compte
</button>

<p id="msg"></p>

</div>

<a class="nav" href="index.html">
  ⬅ accueil
</a>

<script>

const SUPABASE_URL =
"https://cwmlajtwhriqjoopknsp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function register() {

  const pseudo =
    document.getElementById("pseudo").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const pass =
    document.getElementById("pass").value;

  const confirmPass =
    document.getElementById("confirmPass").value;

  const msg =
    document.getElementById("msg");


  if (!pseudo || !email || !pass || !confirmPass) {

    msg.textContent =
      "Remplis tous les champs.";

    return;

  }


  if (pass !== confirmPass) {

    msg.textContent =
      "Les mots de passe ne correspondent pas.";

    return;

  }


  if (pass.length < 6) {

    msg.textContent =
      "Le mot de passe doit contenir au moins 6 caractères.";

    return;

  }


  msg.textContent =
    "Création du compte...";


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: pass,

      options: {

        data: {
          pseudo: pseudo
        }

      }

    });


  if (error) {

    console.error(error);

    msg.textContent =
      "Erreur : " + error.message;

    return;

  }


  localStorage.setItem(
    "pseudo",
    pseudo
  );

  localStorage.setItem(
    "logged",
    "1"
  );


  msg.textContent =
    "Compte créé !";


  setTimeout(() => {

    window.location.href =
      "profil.html";

  }, 800);

}

</script>

</body>
</html>
```
