<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<title>cree compte</title>

<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h1>cree compte</h1>

<div class="box">

<input id="pseudo" placeholder="ton pseudo"><br>

<input id="email" type="email" placeholder="email"><br>

<input id="pass" type="password" placeholder="mot de passe"><br>

<input id="confirmPass" type="password" placeholder="confirme ton mot de passe"><br>

<button onclick="register()">creer compte</button>

<p id="msg"></p>

</div>

<a class="nav" href="login.html">login</a>
<a class="nav" href="index.html">accueil</a>

<script>


const SUPABASE_URL =
    "https://cwmlajtwhriqjoopknsp.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_7h5wqYc5t0NopFoQ83hLbQ_QXpa6PPk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



async function register(){

    const pseudo =
        document.getElementById("pseudo").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const pass =
        document.getElementById("pass").value;

    const confirmPass =
        document.getElementById("confirmPass").value;

    const msg =
        document.getElementById("msg");

    msg.textContent = "";



    if(!pseudo || !email || !pass || !confirmPass){

        msg.textContent =
            "rempli tous les champs";

        return;
    }


    if(!email.includes("@")){

        msg.textContent =
            "email invalide";

        return;
    }


    if(pass !== confirmPass){

        msg.textContent =
            "les mots de passe sont differents";

        return;
    }


    if(pseudo.length < 2){

        msg.textContent =
            "pseudo trop court";

        return;
    }


    msg.textContent =
        "creation du compte...";



    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: pass,

            options: {
                data: {
                    username: pseudo
                }
            }

        });



    if(error){

        console.error(error);

        msg.textContent =
            error.message;

        return;
    }


    const user = data.user;


    if(!user){

        msg.textContent =
            "le compte n'a pas pu etre cree";

        return;
    }


    const { error: profileError } =
        await supabaseClient
            .from("profiles")
            .insert({

                id: user.id,

                username: pseudo

            });



    if(profileError){

        console.error(profileError);

        /*
           The Auth account was created,
           but the profile could not be created.
        */

        msg.textContent =
            "compte cree mais erreur avec le profil: "
            + profileError.message;

        return;
    }


 

    localStorage.setItem(
        "logged",
        "1"
    );

    localStorage.setItem(
        "pseudo",
        pseudo
    );


   
    msg.textContent =
        "compte cree !";


    setTimeout(function(){

        location.href =
            "profil.html";

    }, 500);

}

</script>

</body>
</html>
